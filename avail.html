<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간표 조사 · 슈국 티쳐스</title>
<script src="assets/teacher-auth.js" data-mode="protected"></script>
<!-- 이수경국어 슈국 운영 · 시간표 조사 (2026-11-05 원장님 "새로운 시간표로 바꾸어야 할 때 학생과 학부모님이 안되는 시간을
     모두 골라 제출하고 그 중에 가능한 시간으로 한 학교의 학년을 배치")
     → 결정: 표시 2단계(가능/안 돼요) · 학생과 학부모님이 응답 하나를 같이 고침 · 제출하면 별 +1 · 대상 전체·학년·학교·반·개인(여러 명).
     · 조사 만들기: 제목·안내·마감일·후보 칸(요일×시간)·대상 → avail_surveys + avail_targets(대상 학생을 한 명씩 풀어 넣음).
     · 학생은 학생 페이지(리포트 s.html) '시간표 조사' 카드에서 안 되는 칸을 고른다(avail_submit — 062).
     · 결과: 칸마다 가능 인원(학교·학년으로 거르기) · 미제출 학생 · 응답 표 · 표 복사.
     · 수파베이스 062 마이그레이션. 교사 인증으로 표를 직접 읽고 쓴다 — 학생이 여는 페이지에 이 조각을 넣지 말 것. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF; --ink:#2A332F; --ink-soft:#4F5C56; --cap:#5C6A64;
    --accent:#4C6E66; --line:#D7E3DD; --line-soft:#E5EDE8; --radius:18px;
    --lilac:#EDE4F4; --lilac-hover:#E3D7EE; --lilac-ink:#5A4A6A;
    --serif:"Gowun Batang",serif;
    --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;padding:0 0 80px;}
  .wrap{max-width:980px;margin:0 auto;padding:0 18px;}
  .back{display:inline-flex;align-items:center;gap:6px;margin:24px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .back svg{width:16px;height:16px;}
  header{padding:14px 2px 20px;}
  h1{font-family:var(--serif);font-size:1.45rem;color:var(--accent);margin:0;}
  .h-row{display:flex;align-items:center;gap:10px;}
  .help-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;}
  .help-btn svg{width:16px;height:16px;}
  /* 사용 방법 옆 창 (2026-09-27 사용자 "사용방법을 사이드 팝업으로") */
  .guide-dim{position:fixed;inset:0;background:rgba(42,51,47,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .guide-dim.on{opacity:1;pointer-events:auto;}
  .guide{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(42,51,47,.12);}
  .guide.on{transform:none;}
  .guide .g-hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .guide .g-hd h2{font-family:var(--serif);font-size:1.1rem;margin:0;flex:1;}
  .guide .g-x{border:none;background:#F2F5F3;border-radius:10px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .guide .g-x svg{width:18px;height:18px;}
  .guide .g-bd{overflow:auto;padding:6px 20px 30px;font-size:.9rem;line-height:1.7;}
  .guide h3{font-family:var(--serif);font-size:.98rem;margin:20px 0 6px;color:var(--accent);}
  .guide p{margin:4px 0;}
  .guide ol,.guide ul{margin:4px 0;padding-left:20px;}
  .guide li{margin:2px 0;}
  .guide .tip{background:#F4F6FA;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.85rem;color:var(--ink-soft);}
  .guide table{font-size:.82rem;margin:6px 0;}
  .guide th,.guide td{white-space:normal;vertical-align:top;padding:6px;}
  .guide th{color:var(--ink);font-weight:700;background:#F7F9F8;}
  .guide .btnname{display:inline-block;background:#F2F5F3;border-radius:7px;padding:0 7px;font-size:.84rem;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){ .guide,.guide-dim{transition:none;} }
  .intro{color:var(--ink-soft);font-size:.9rem;margin:6px 0 0;}
  .card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(42,51,47,.05);}
  .card h2{font-family:var(--serif);font-size:1.08rem;margin:0 0 12px;}
  label.f{display:block;font-size:.84rem;color:var(--ink-soft);margin:12px 0 5px;}
  input[type=text],select{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
  input[type=text]:focus,select:focus{outline:none;border-color:#B9A5CC;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){ .row2{grid-template-columns:1fr;} }
  /* 휴대폰: 영상 카드는 세로로 쌓고, 학생별 결과는 표 대신 두 줄 목록 (2026-09-28 사용자 "모바일에서 학생 확인이 어렵습니다") */
  .mlist{display:none;}
  .mrow{padding:10px 2px;border-bottom:1px solid var(--line-soft);}
  .mrow .m1{display:flex;align-items:center;gap:8px;}
  .mrow .m1 input{width:18px;height:18px;accent-color:#8D83A8;flex:none;}
  .mrow .nm{font-weight:700;font-size:.95rem;}
  .mrow .stt{margin-left:auto;font-size:.8rem;white-space:nowrap;}
  .mrow .m2{font-size:.8rem;color:var(--cap);margin:3px 0 0 26px;line-height:1.55;}
  .mrow .m2 b{color:var(--ink);font-weight:700;}
  .mrow .m3{display:flex;align-items:center;gap:8px;margin:4px 0 0 26px;}
  .mrow .mbar{flex:1;height:5px;border-radius:5px;background:#EEF2EF;overflow:hidden;}
  .mrow .mbar i{display:block;height:100%;background:#B9A5CC;}
  .mrow.done .mbar i{background:#4C6E66;}
  .mrow .rowbtn{margin-left:auto;}
  .mall{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-soft);padding:6px 2px;border-bottom:1px solid var(--line);}
  .mall input{width:18px;height:18px;accent-color:#8D83A8;}
  .yt-prev{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:.84rem;color:var(--cap);min-height:20px;}
  .yt-prev img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#EEF2EF;}
  .btn{font:inherit;font-size:.9rem;border:none;border-radius:11px;padding:9px 15px;cursor:pointer;background:#F2F5F3;color:var(--ink);}
  .btn:hover{background:#E8EEEA;}
  .btn.lav{background:var(--lilac);color:var(--lilac-ink);font-family:var(--serif);font-weight:700;}
  .btn.lav:hover{background:var(--lilac-hover);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.sm{font-size:.8rem;padding:6px 11px;border-radius:9px;}
  .seg{display:inline-flex;gap:6px;}
  .seg .btn.on{background:var(--lilac);color:var(--lilac-ink);font-weight:700;}
  .cls-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .cls-bar select{width:auto;min-width:180px;}
  .sum{margin-top:12px;font-size:.88rem;color:var(--ink-soft);}
  .sum b{color:var(--ink);}
  .warn{margin-top:8px;font-size:.84rem;background:#F9EFD0;color:#7A6330;border-radius:10px;padding:8px 12px;}
  .go-row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;align-items:center;}
  .muted{color:var(--cap);font-size:.86rem;}
  .vid{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line-soft);}
  .vid:first-child{border-top:none;}
  .vid img{width:132px;flex:none;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#EEF2EF;}
  .vid .b{flex:1;min-width:0;}
  .vid h3{font-family:var(--serif);font-size:1rem;margin:0;}
  .vid .meta{font-size:.8rem;color:var(--cap);margin:2px 0 0;}
  .vid .stat{font-size:.86rem;margin:6px 0 0;}
  /* 영상 카드: 수업 자료(파일) 상자와 버튼 줄을 나눈다 (2026-09-27 사용자 "학생별 결과부터의 메뉴가 파일과 구분이 안돼요") */
  .vid .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);}
  .vid .acts .sep{flex:1;}
  .vid .acts .btn.danger{background:none;color:#B0736A;}
  .vid .acts .btn.danger:hover{background:#F7E2DE;}
  .vfbox{margin-top:12px;background:#F4F6FA;border-radius:12px;padding:10px 14px;}
  .vfbox .cap{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--cap);margin:0 0 4px;}
  .vfbox .cap .add{margin-left:auto;font:inherit;font-size:.8rem;border:none;background:none;color:#64749E;cursor:pointer;padding:2px 0;}
  .vfbox .cap .add:hover{text-decoration:underline;}
  .vfrow{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:4px 0;}
  .vfrow svg{width:16px;height:16px;flex:none;color:#64749E;}
  .vfrow a{color:var(--ink);cursor:pointer;text-decoration:none;overflow-wrap:anywhere;}
  .vfrow a:hover{text-decoration:underline;}
  .vfrow .sz{color:var(--cap);font-size:.78rem;white-space:nowrap;}
  .vfrow .rm{margin-left:auto;font:inherit;font-size:.76rem;border:none;background:none;color:var(--cap);cursor:pointer;text-decoration:underline;white-space:nowrap;}
  .vfbox .none{font-size:.82rem;color:var(--cap);}
  .vid.off{opacity:.62;}
  .chip{display:inline-block;font-size:.74rem;border-radius:20px;padding:1px 9px;margin-left:6px;vertical-align:2px;background:#F2F5F3;color:var(--cap);}
  .bar{height:6px;border-radius:6px;background:#EEF2EF;overflow:hidden;margin-top:6px;max-width:280px;}
  .bar i{display:block;height:100%;background:#B9A5CC;}
  .res{margin-top:10px;overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:.86rem;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  th{font-weight:400;color:var(--cap);font-size:.78rem;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.done td:first-child{font-weight:700;}
  .st-ok{color:#3A6B5E;font-weight:700;}
  .st-no{color:#B0736A;}
  .res-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .res-bar select{width:auto;}
  .modes{flex-wrap:wrap;}
  .addto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--lilac);color:var(--lilac-ink);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:4px;}
  .addto span{flex:1;min-width:200px;}
  .res-bar .cancel{background:#F7E2DE;color:#8A4E46;}
  .res-bar .cancel:hover{background:#F2D6D0;}
  td.ck,th.ck{width:28px;padding-right:0;}
  td.ck input,th.ck input{width:16px;height:16px;accent-color:#8D83A8;}
  .rowbtn{font:inherit;font-size:.76rem;border:none;background:none;color:var(--cap);cursor:pointer;padding:2px 4px;text-decoration:underline;}
  .mpane{display:none;margin-top:10px;}
  .mpane.on{display:block;}
  .gpills{display:flex;flex-wrap:wrap;gap:6px;}
  .gpills .btn.on{background:var(--lilac);color:var(--lilac-ink);font-weight:700;}
  #stuQ{max-width:320px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chips .fchip{background:var(--lilac);color:var(--lilac-ink);}
  .chips .fchip button{color:var(--lilac-ink);}
  .files-pick{margin-top:6px;}
  .files-pick input[type=file]{font:inherit;font-size:.86rem;}
  .fsel{margin:6px 0 0;padding:0;list-style:none;font-size:.84rem;color:var(--ink-soft);}
  .fsel li.bad{color:#B0736A;}
  .fchip{display:inline-flex;align-items:center;gap:6px;background:#F2F5F3;border-radius:9px;padding:4px 6px 4px 10px;font-size:.8rem;}
  .fchip a{color:var(--ink);text-decoration:none;cursor:pointer;}
  .fchip a:hover{text-decoration:underline;}
  .fchip button{border:none;background:none;color:var(--cap);cursor:pointer;font-size:.9rem;padding:0 4px;line-height:1;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#2A332F;color:#fff;font-size:.86rem;padding:9px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:9;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  input[type=date]{font:inherit;font-size:.95rem;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
  textarea{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:11px;min-height:70px;resize:vertical;}
  /* 후보 칸 */
  .slot-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .slot-add select{width:auto;}
  .dpills{display:inline-flex;gap:4px;flex-wrap:wrap;}
  .dpills .btn.on{background:var(--lilac);color:var(--lilac-ink);font-weight:700;}
  .slots{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .slots .sd{display:flex;gap:8px;align-items:flex-start;}
  .slots .sd b{font-family:"Do Hyeon",var(--sans);font-weight:400;font-size:1.05rem;width:28px;flex:none;padding-top:3px;}
  .slots .sd .chips{margin-top:0;}
  /* 조사 목록·결과 */
  .sv{padding:14px 0;border-top:1px solid var(--line-soft);}
  .sv:first-child{border-top:none;}
  .sv h3{font-family:var(--serif);font-size:1.02rem;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sv .meta{font-size:.8rem;color:var(--cap);margin:2px 0 0;}
  .chip.on{background:#E2F4EC;color:#2A6555;}
  .chip.end{background:#F7E2DE;color:#8A4B42;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .acts a.btn{text-decoration:none;display:inline-flex;align-items:center;}
  .acts .btn.danger{background:none;color:#B0736A;}
  .acts .btn.danger:hover{background:#F7E2DE;}
  .resbox{margin-top:12px;background:#F7F9F8;border-radius:14px;padding:14px;}
  .resbox h4{font-family:var(--serif);font-size:.95rem;margin:14px 0 6px;}
  .resbox h4:first-child{margin-top:0;}
  .heat{border-collapse:separate;border-spacing:4px;width:auto;}
  .heat th{text-align:center;font-size:.8rem;color:var(--ink-soft);padding:2px 6px;}
  .heat th.tm{text-align:right;}
  .heat td{padding:0;border:none;}
  .heat .cell{font:inherit;border:none;border-radius:10px;min-width:74px;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;color:var(--ink);}
  .heat .cell b{font-family:"Do Hyeon",var(--sans);font-weight:400;font-size:1.1rem;}
  .heat .cell small{font-size:.7rem;color:var(--ink-soft);}
  .heat .cell.sel{outline:2px solid #8D83A8;}
  .heat .none{min-width:74px;height:44px;border-radius:10px;background:#EEF1EF;}
  .who-no{margin-top:8px;font-size:.86rem;background:#fff;border-radius:10px;padding:8px 12px;}
  .who-no b{color:#8A4B42;}
  .nslot{display:inline-block;background:#F7E2DE;color:#8A4B42;border-radius:6px;padding:0 6px;font-size:.76rem;margin:1px 2px 1px 0;}
  .ok-all{color:#3A6B5E;font-size:.8rem;}
  .names{font-size:.86rem;line-height:1.8;}
  .names span{display:inline-block;background:#fff;border-radius:8px;padding:0 8px;margin:2px 3px 2px 0;}
  .pl-card{background:#fff;border-radius:12px;padding:12px 14px;margin-top:10px;}
  .pl-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pl-hd b{font-family:"Do Hyeon",var(--sans);font-weight:400;font-size:1.15rem;color:var(--lilac-ink);}
  .pl-hd span{font-size:.88rem;}
  .pl-hd .pl-n{margin-left:auto;font-size:.84rem;background:#F6EFD8;color:#7A6330;border-radius:20px;padding:2px 10px;}
  .pl-hd .pl-n.all{background:#E2F4EC;color:#2A6555;}
  .pl-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px;}
  .pl-c{background:#F7F9F8;border-radius:10px;padding:8px 10px;}
  .pl-c .t{margin:0 0 2px;font-size:.86rem;font-weight:700;}
  .pl-c .names span{background:#fff;}
  .pl-bar{gap:8px;font-size:.86rem;}
  @media (max-width:640px){
    .heat .cell,.heat .none{min-width:52px;}
    .res table.rt{font-size:.8rem;}
  }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="ops.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> 슈국 운영으로 가기</a>
  <header>
    <div class="h-row"><h1>시간표 조사</h1></div>
    <p class="intro">새 시간표로 바꿀 때 후보 시간 칸을 정해 조사를 엽니다. 학생과 학부모님은 학생 페이지의 <b>시간표 조사</b>에서 안 되는 칸을 골라 제출해요(처음 제출하면 별 +1). 결과에서 칸마다 가능한 인원을 확인합니다.</p>
  </header>

  <section class="card" id="addCard">
    <h2>조사 만들기</h2>
    <div class="row2">
      <div><label class="f" for="sTitle">제목 (학생에게 보여요)</label><input type="text" id="sTitle" maxlength="60" placeholder="예) 화정고1 겨울방학 새 시간표 조사"></div>
      <div><label class="f" for="sDue">마감일 (그 날 밤까지 받아요)</label><input type="date" id="sDue"></div>
    </div>
    <label class="f" for="sMemo">안내 (선택 — 학생에게 보여요)</label>
    <textarea id="sMemo" maxlength="300" placeholder="예) 12/16(수)부터 바뀌는 시간표입니다. 수업이 어려운 시간을 모두 골라 주세요."></textarea>

    <label class="f">후보 시간 칸</label>
    <div class="slot-add">
      <span class="dpills" id="dPills"></span>
      <select id="tStart" aria-label="시작 시각"></select>
      <select id="tDur" aria-label="수업 길이"><option value="30">30분</option><option value="60">60분</option><option value="90">90분</option><option value="120" selected>120분</option></select>
      <span class="muted" id="tEndNote"></span>
      <button class="btn sm lav" type="button" onclick="addSlot()">칸 더하기</button>
      <button class="btn sm" type="button" onclick="presetSlots()">슈국 기본 칸 넣기</button>
      <button class="btn sm" type="button" onclick="clearSlots()">모두 지우기</button>
    </div>

    </div>

    <div class="mpane" id="pane-grade"><div class="gpills" id="gradePills"><span class="muted">재원 명단을 불러오는 중…</span></div></div>
    <div class="mpane" id="pane-school"><div class="cls-bar"><select id="schSel" onchange="addSchool(this.value)"></select></div><p class="muted" style="margin:6px 0 0">한 학교의 한 학년만 고르려면 [학교]로 담은 뒤 아래 '학년만' 칸에서 학년을 고르세요.</p>
      <div class="cls-bar"><select id="schGrade" onchange="summary()"><option value="">학년 모두</option></select></div></div>
    <div class="mpane" id="pane-cls"><div class="cls-bar">
      <span class="seg"><button class="btn sm on" type="button" id="bk-정규" onclick="setBook('정규')">정규</button><button class="btn sm" type="button" id="bk-내신" onclick="setBook('내신')">내신</button></span>
      <select id="tSel" onchange="fillClassSel()"></select>
      <select id="clsSel" onchange="addClass(this.value)"><option value="">반 목록을 불러오는 중…</option></select>
    </div></div>
    <div class="mpane" id="pane-stu"><div class="cls-bar">
      <input type="text" id="stuQ" list="stuList" placeholder="학생 이름을 입력하고 목록에서 고르세요 (여러 명 담을 수 있어요)" autocomplete="off"><datalist id="stuList"></datalist>
      <button class="btn sm" type="button" onclick="addStu()">추가</button>
    </div></div>
    <div class="chips" id="chips"></div>

    <div class="go-row"><span class="muted" id="goNote"></span><button class="btn lav" id="goBtn" onclick="createSurvey()" disabled>조사 만들고 열기</button></div>
  </section>

  <section class="card">
    <h2>조사 목록</h2>
    <div id="list"><p class="muted">불러오는 중…</p></div>
  </section>
</main>
<div id="toast"></div>

<script>
  const SB_REST = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
  const SB_KEY  = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  const DAYS = { '월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':7 };
  const DAY_LIST = ['월', '화', '수', '목', '금', '토', '일'];
  let BOOK = '정규', CLASSES = {}, STUS = [], MODE = 'stu', SEL = { grade: [], school: [], cls: [], stu: [] };
  let SLOTS = [], DSEL = [], SURVEYS = [], TGTS = [], RESP = [], OPEN = {}, CELL = {}, RFILT = {}, ME = '';

  const $ = id => document.getElementById(id);
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }
  function sb(method, path, body, prefer){
    const h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    if (prefer) h['Prefer'] = prefer;
    return fetch(SB_REST + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body), cache: 'no-store' })
      .then(r => r.text().then(t => { if (!r.ok) throw new Error('sb ' + r.status + ' ' + t.slice(0, 160)); return t ? JSON.parse(t) : null; }));
  }
  function sbAll(path){
    const LIM = 1000, out = [];
    const step = off => sb('GET', path + (path.indexOf('?') >= 0 ? '&' : '?') + 'limit=' + LIM + '&offset=' + off)
      .then(rows => { rows.forEach(r => out.push(r)); return rows.length < LIM ? out : step(off + LIM); });
    return step(0);
  }


  function tLabel(t){ t = String(t || '').trim(); return t ? (t === '슈' ? '이수경' : t) + 'T' : ''; }
  function gradeShort(g){
    const s = String(g || '').replace(/20\d{2}/, ''), m = s.match(/[1-3]/);
    return m ? ((s.indexOf('중') >= 0 ? '중' : '고') + m[0]) : String(g || '');
  }
  function kst(iso){
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const d = new Date(t + 9 * 3600e3), p = n => ('0' + n).slice(-2);
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  }
  function todayKst(){ return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function dueLabel(d){
    if (!d) return '마감 없음';
    const x = new Date(d + 'T00:00:00');
    return (x.getMonth() + 1) + '/' + x.getDate() + ' (' + '일월화수목금토'.charAt(x.getDay()) + ')까지';
  }

  /* ── 시간 표기 — 슈국 스케쥴 mins/timeValOf 와 같은 규칙('오전9:30' · '5:30' · '밤10:00') ── */
  function mins(t){
    const s = String(t || '').trim(), am = s.indexOf('오전') === 0, night = s.indexOf('밤') === 0;
    const p = s.replace(/^(오전|밤)\s*/, '').split(':');
    let h = parseInt(p[0], 10) || 0; const m = parseInt(p[1], 10) || 0;
    if (am) return (h === 12 ? 0 : h) * 60 + m;
    if (night) return (h === 12 ? 24 : h + 12) * 60 + m;
    if (h < 10) h += 12;
    return h * 60 + m;
  }
  function fmt12(m){ let h = Math.floor(m / 60) % 12; if (h === 0) h = 12; return h + ':' + ('0' + (m % 60)).slice(-2); }
  function timeValOf(m){ if (m < 600) return '오전' + fmt12(m); if (m >= 1320) return '밤' + fmt12(m); return fmt12(m); }
  function hmLabel(m){ const ap = m < 720 ? '오전' : (m >= 1320 ? '밤' : '오후'); return ap + ' ' + fmt12(m); }
  function slotLabel(sl){ const a = mins(sl.start), b = mins(sl.end); return hmLabel(a) + ' · ' + (b - a) + '분'; }
  function slotSort(a, b){ return (DAYS[a.day] - DAYS[b.day]) || (mins(a.start) - mins(b.start)); }

  /* ── 후보 칸 ── */
  function fillTimeSel(){
    let o = '';
    for (let m = 8 * 60; m <= 23 * 60; m += 30) o += '<option value="' + m + '">' + hmLabel(m) + '</option>';
    $('tStart').innerHTML = o;
    $('tStart').value = String(17 * 60 + 30);
    ['tStart', 'tDur'].forEach(id => $(id).addEventListener('change', endNote));
    endNote();
    $('dPills').innerHTML = DAY_LIST.map(d => '<button class="btn sm" type="button" data-d="' + d + '">' + d + '</button>').join('');
  }
  $('dPills') && document.addEventListener('click', e => {
    const b = e.target.closest('#dPills [data-d]'); if (!b) return;
    const d = b.dataset.d, i = DSEL.indexOf(d);
    if (i >= 0) DSEL.splice(i, 1); else DSEL.push(d);
    b.classList.toggle('on', i < 0);
  });
  function pushSlot(day, start, end){
    const id = day + '-' + start;
    if (SLOTS.some(s => s.id === id)) return false;
    SLOTS.push({ id, day, start, end }); return true;
  }
  // 끝 시각 = 시작 + 수업 길이(30·60·90·120분 — 2026-11-05 원장님), 밤 12시까지
  function slotEnd(){ return +$('tStart').value + +$('tDur').value; }
  function endNote(){
    const e = slotEnd();
    $('tEndNote').textContent = e > 1440 ? '밤 12시를 넘어요' : '→ ' + hmLabel(e) + '까지';
  }
  function addSlot(){
    if (!DSEL.length){ toast('요일을 먼저 골라 주세요'); return; }
    const s = +$('tStart').value, e = slotEnd();
    if (e > 1440){ toast('끝 시각이 밤 12시를 넘어요. 시작 시각이나 길이를 바꿔 주세요'); return; }
    let n = 0; DSEL.forEach(d => { if (pushSlot(d, timeValOf(s), timeValOf(e))) n++; });
    if (!n) toast('이미 있는 칸이에요');
    drawSlots(); summary();
  }
  // 슈국 기본 칸 — 평일 5:30·8:00, 주말 11:00·1:30·4:30·7:00 (2027 예상 고1 시간표의 칸과 같다)
  function presetSlots(){
    ['수', '목', '금'].forEach(d => { pushSlot(d, '5:30', '7:30'); pushSlot(d, '8:00', '10:00'); });
    ['토', '일'].forEach(d => { pushSlot(d, '11:00', '1:00'); pushSlot(d, '1:30', '3:30'); pushSlot(d, '4:30', '6:30'); pushSlot(d, '7:00', '9:00'); });
    drawSlots(); summary();
  }
  function clearSlots(){ if (SLOTS.length && !confirm('후보 칸을 모두 지울까요?')) return; SLOTS = []; drawSlots(); summary(); }
  function drawSlots(){
    SLOTS.sort(slotSort);
    const byDay = {}; SLOTS.forEach(s => { (byDay[s.day] = byDay[s.day] || []).push(s); });
    $('slots').innerHTML = SLOTS.length ? DAY_LIST.filter(d => byDay[d]).map(d => '<div class="sd"><b>' + d + '</b><div class="chips">' +
      byDay[d].map(s => '<span class="fchip" title="' + esc(hmLabel(mins(s.start)) + '~' + hmLabel(mins(s.end))) + '">' + esc(slotLabel(s)) + '<button type="button" data-rmslot="' + esc(s.id) + '" aria-label="빼기" title="빼기">×</button></span>').join('') +
      '</div></div>').join('') + '<p class="muted" style="margin:2px 0 0">후보 칸 ' + SLOTS.length + '개</p>'
      : '<p class="muted" style="margin:0">아직 칸이 없어요. 요일을 고르고 시간을 정해 [칸 더하기]를 누르거나 [슈국 기본 칸 넣기]를 누르세요.</p>';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-rmslot]'); if (!b) return;
    SLOTS = SLOTS.filter(s => s.id !== b.dataset.rmslot); drawSlots(); summary();
  });

  /* ── 명단 이름 → 재원 학생 (clinic_assign clsFind 와 같은 규칙) ── */
  function schoolLoose(hint, school){
    const a = String(hint || '').replace(/\s/g, ''), b = String(school || '').replace(/\s/g, '');
    return !!a && !!b && (b.indexOf(a) === 0 || a.indexOf(b) === 0);
  }
  function findStu(tok){
    const raw = String(tok || '');
    const plain = raw.replace(/^\s*\([^)]*\)\s*/, '').replace(/\(.*\)$/, '').trim();
    const hint = (raw.match(/^\s*\(([^)]*)\)/) || [])[1] || '';
    let hits = STUS.filter(s => s.name === plain);
    if (!hits.length && /A$/.test(plain)) hits = STUS.filter(s => s.name === plain.slice(0, -1));
    if (hits.length > 1 && hint){ const nr = hits.filter(s => schoolLoose(hint, s.school)); if (nr.length) hits = nr; }
    return { plain, hit: hits.length === 1 ? hits[0] : null, dup: hits.length > 1 };
  }
  /* ── 배정 대상 (2026-09-27 사용자 "전체, 학년, 학교, 반, 개인으로 설정" + "반 리스트는 드롭다운") ──
   * 대상은 '명세' 목록으로 다룬다 — {type:'all'} · {type:'grade',value:'고1'} · {type:'school',value:'화정고'}
   * · {type:'class',book,class_id,name,day,start,teacher}(옛 기록은 type 없이 반) · {type:'student',code,name}.
   * 영상의 classes 열에 이 명세를 그대로 저장하고, [명단 다시 반영]도 같은 명세로 다시 푼다. */
  const GRADE_ORDER = ['중1', '중2', '중3', '고1', '고2', '고3'];
  function specType(c){ return c.type || 'class'; }
  /* {type:'exclude',code,name} = 배정 취소한 학생 — 반·학년 명세가 그 학생을 다시 넣지 않게 한다(명단 다시 반영). 표시에서는 뺀다 */
  function isShown(c){ return specType(c) !== 'exclude'; }
  function specLabel(c){
    const t = specType(c);
    return t === 'all' ? '전체' : t === 'grade' || t === 'school' ? c.value : t === 'student' ? (c.name || '개인') : c.name;
  }
  function specOf(mode){
    if (mode === 'all') return [{ type: 'all' }];
    if (mode === 'grade') return SEL.grade.map(v => ({ type: 'grade', value: v }));
    if (mode === 'school') return SEL.school.map(v => ({ type: 'school', value: v }));
    if (mode === 'stu') return SEL.stu.map(code => { const s = STUS.find(x => x.code === code); return { type: 'student', code, name: s ? s.name : '' }; });
    return SEL.cls.map(c => ({ type: 'class', book: c.book, class_id: c.id, name: c.name, day: c.day, start: c.start, teacher: c.teacher }));
  }
  function classOfSpec(c){ return (CLASSES[c.book] || []).find(x => x.id === c.class_id) || null; }
  /* 명세 → 배정할 학생 {code → {stu, cls}} + 못 넣는 이름들 */
  function expand(spec){
    const out = {}, miss = [], dup = [], nocode = [];
    const put = (s, label) => {
      if (!s.code){ if (nocode.indexOf(s.name) < 0) nocode.push(s.name); return; }
      if (!out[s.code]) out[s.code] = { stu: s, cls: label };
    };
    const ex = {}; spec.forEach(c => { if (specType(c) === 'exclude') ex[c.code] = 1; });
    spec.forEach(c => {
      const t = specType(c), label = t === 'student' ? '개인' : specLabel(c);
      if (t === 'exclude') return;
      if (t === 'all') STUS.forEach(s => put(s, label));
      else if (t === 'grade') STUS.filter(s => gradeShort(s.grade) === c.value).forEach(s => put(s, label));
      else if (t === 'school') STUS.filter(s => s.school === c.value).forEach(s => put(s, label));
      else if (t === 'student'){ const s = STUS.find(x => x.code === c.code); if (s) put(s, label); }
      else {
        const cl = classOfSpec(c); if (!cl) return;
        cl.students.forEach(tok => {
          const f = findStu(tok);
          if (!f.plain) return;
          if (f.dup){ if (dup.indexOf(f.plain) < 0) dup.push(f.plain); return; }
          if (!f.hit){ if (miss.indexOf(f.plain) < 0) miss.push(f.plain); return; }
          put(f.hit, cl.name);
        });
      }
    });
    Object.keys(ex).forEach(k => { delete out[k]; });
    return { out, miss, dup, nocode };
  }

  /* ── 방식 고르기 ── */
  function setMode(m){
    MODE = m;
    document.querySelectorAll('#modeSeg .btn').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    ['all', 'grade', 'school', 'cls', 'stu'].forEach(x => $('pane-' + x).classList.toggle('on', x === m));
    drawChips(); summary();
  }
  $('modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) setMode(b.dataset.m); });
  function fillPickers(){
    // 학년 알약
    const gs = {}; STUS.forEach(s => { const g = gradeShort(s.grade); if (g) gs[g] = (gs[g] || 0) + 1; });
    const glist = Object.keys(gs).sort((a, b) => ((GRADE_ORDER.indexOf(a) + 1) || 99) - ((GRADE_ORDER.indexOf(b) + 1) || 99) || a.localeCompare(b, 'ko'));
    $('gradePills').innerHTML = glist.map(g => '<button class="btn sm' + (SEL.grade.indexOf(g) >= 0 ? ' on' : '') + '" type="button" data-g="' + esc(g) + '">' + esc(g) + ' <span class="muted">' + gs[g] + '명</span></button>').join('') || '<span class="muted">학년 정보가 없어요</span>';
    // 학교 드롭다운 (많은 순)
    const sc = {}; STUS.forEach(s => { if (s.school) sc[s.school] = (sc[s.school] || 0) + 1; });
    $('schSel').innerHTML = '<option value="">학교를 고르세요 (' + Object.keys(sc).length + '곳)</option>' +
      Object.keys(sc).sort((a, b) => sc[b] - sc[a] || a.localeCompare(b, 'ko')).map(x => '<option value="' + esc(x) + '">' + esc(x) + ' (' + sc[x] + '명)</option>').join('');
    // 개인 — 이름 · 학교 학년 (동명이인 구분)
    $('stuList').innerHTML = STUS.filter(s => s.code).map(s => '<option value="' + esc(stuKey(s)) + '"></option>').join('');
    $('allNote').textContent = '재원생 전체 ' + STUS.filter(s => s.code).length + '명에게 배정해요.';
  }
  function stuKey(s){ return s.name + ' · ' + [s.school, gradeShort(s.grade)].filter(Boolean).join(' '); }
  $('gradePills').addEventListener('click', e => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    const g = b.dataset.g, i = SEL.grade.indexOf(g);
    if (i >= 0) SEL.grade.splice(i, 1); else SEL.grade.push(g);
    b.classList.toggle('on', i < 0); drawChips(); summary();
  });
  function addSchool(v){ if (v && SEL.school.indexOf(v) < 0) SEL.school.push(v); $('schSel').value = ''; drawChips(); summary(); }
  function addStu(){
    const q = $('stuQ').value.trim(); if (!q) return;
    let s = STUS.find(x => x.code && stuKey(x) === q);
    if (!s){ const hits = STUS.filter(x => x.code && x.name === q); if (hits.length === 1) s = hits[0]; else if (hits.length > 1){ toast('같은 이름이 ' + hits.length + '명 있어요 — 목록에서 학교까지 골라 주세요'); return; } }
    if (!s){ toast('재원 명단에서 찾지 못했어요'); return; }
    if (SEL.stu.indexOf(s.code) < 0) SEL.stu.push(s.code);
    $('stuQ').value = ''; drawChips(); summary();
  }
  $('stuQ').addEventListener('change', () => { if (STUS.some(x => x.code && stuKey(x) === $('stuQ').value.trim())) addStu(); });
  $('stuQ').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addStu(); } });
  function drawChips(){
    let items = [];
    if (MODE === 'grade') items = SEL.grade.map(v => ['grade', v, v]);
    if (MODE === 'school') items = SEL.school.map(v => ['school', v, v]);
    if (MODE === 'cls') items = SEL.cls.map(c => ['cls', pickKey(c), c.book + ' ' + c.day + ' ' + c.start + ' · ' + c.name + (c.teacher ? ' · ' + tLabel(c.teacher) : '')]);
    if (MODE === 'stu') items = SEL.stu.map(code => { const s = STUS.find(x => x.code === code); return ['stu', code, s ? stuKey(s) : code]; });
    $('chips').innerHTML = items.map(([k, v, l]) => '<span class="fchip">' + esc(l) + '<button type="button" data-k="' + k + '" data-v="' + esc(v) + '" aria-label="빼기" title="빼기">×</button></span>').join('');
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'grade'){ SEL.grade = SEL.grade.filter(x => x !== v); fillPickers(); }
    if (k === 'school') SEL.school = SEL.school.filter(x => x !== v);
    if (k === 'cls') SEL.cls = SEL.cls.filter(c => pickKey(c) !== v);
    if (k === 'stu') SEL.stu = SEL.stu.filter(x => x !== v);
    drawChips(); summary();
  });

  /* ── 시간표 반 (드롭다운) ── */
  function loadClasses(book){
    if (CLASSES[book]) return Promise.resolve(CLASSES[book]);
    // '이 주만' 반(w…)은 그 날짜에만 있는 임시 반이라 뺀다
    return sbAll('/tt_classes?book=eq.' + encodeURIComponent(book) + '&class_id=not.like.w*&select=class_id,name,day,start_time,teacher,roster')
      .then(rows => {
        CLASSES[book] = rows.map(r => ({ book, id: r.class_id, name: r.name, day: r.day, start: r.start_time, teacher: String(r.teacher || ''),
          students: String(r.roster || '').trim().split(/\s+/).filter(Boolean) }))
          .sort((a, b) => (DAYS[a.day] - DAYS[b.day]) || String(a.start).localeCompare(String(b.start), 'ko', { numeric: true }) || a.name.localeCompare(b.name, 'ko'));
        return CLASSES[book];
      });
  }
  function setBook(b){
    BOOK = b;
    ['정규', '내신'].forEach(x => $('bk-' + x).classList.toggle('on', x === b));
    $('clsSel').innerHTML = '<option value="">반 목록을 불러오는 중…</option>';

  /* ── PLACE-CORE: 자동 배치 추천 (2026-11-05 원장님 "자동 배치 추천도 만들어줘") ──────────────
   * 후보 칸 중 n칸을 골라 반을 연다고 할 때, 제출한 학생을 가장 많이 넣는 칸 조합을 찾는다.
   * · 주 1회: 학생마다 가능한 칸 하나 · 주 2회: 서로 다른 요일의 가능한 칸 둘(가·나는 선생님이 정한다).
   * · 칸마다 정원(cap). 배정은 최대 유량(정확) → 칸 인원을 고르게 옮겨 맞춘다.
   * · 조합이 10만 개 이하이면 모두 보고(빠른 상한으로 줄 세운 뒤 위 400개만 정확히 계산), 넘으면 빔 탐색.
   * · 순서: 다 들어간 학생 수 → 들어간 횟수 합 → 칸 인원 차이 작은 순.
   * tools/avail-place-test.js 가 이 블록만 떼어 검사한다 — 고치면 함께. */
  const PLACE = (function(){
    function combos(m, n){ let c = 1; for (let i = 0; i < n; i++) c = c * (m - i) / (i + 1); return Math.round(c); }
    function maxflow(N, edges, src, snk){
      const head = new Array(N).fill(-1), to = [], cap = [], nxt = [];
      const add = (u, v, c) => { to.push(v); cap.push(c); nxt.push(head[u]); head[u] = to.length - 1; to.push(u); cap.push(0); nxt.push(head[v]); head[v] = to.length - 1; };
      edges.forEach(e => add(e[0], e[1], e[2]));
      let flow = 0;
      const level = new Array(N), it = new Array(N);
      const bfs = () => { level.fill(-1); level[src] = 0; const q = [src];
        for (let qi = 0; qi < q.length; qi++){ const u = q[qi]; for (let e = head[u]; e >= 0; e = nxt[e]) if (cap[e] > 0 && level[to[e]] < 0){ level[to[e]] = level[u] + 1; q.push(to[e]); } }
        return level[snk] >= 0; };
      const dfs = (u, f) => { if (u === snk) return f;
        for (; it[u] >= 0; it[u] = nxt[it[u]]){ const e = it[u], v = to[e];
          if (cap[e] > 0 && level[v] === level[u] + 1){ const d = dfs(v, Math.min(f, cap[e])); if (d > 0){ cap[e] -= d; cap[e ^ 1] += d; return d; } } }
        return 0; };
      while (bfs()){ for (let i = 0; i < N; i++) it[i] = head[i]; let f; while ((f = dfs(src, 1e9)) > 0) flow += f; }
      return { flow, to, cap, head, nxt };
    }
    /* 학생 배정: stus[i].ok = 가능한 칸 번호 집합(Set), slots[j].day */
    /* 주 2회: 최대 유량은 '들어간 횟수 합'을 최대로 하므로 한 번만 들어간 학생이 자리를 차지할 수 있다.
     * 한 번만 들어간 학생을 한 명씩 빼 보고, 다 들어간 학생이 늘거나 같으면서 반쪽이 줄면 그대로 둔다. */
    function assign(stus, slots, pick, f, cap, order){
      if (f !== 2) return assign1(stus, slots, pick, f, cap, null);
      const halves = r => r.got.map((g, i) => g.length === 1 ? i : -1).filter(i => i >= 0);
      let excl = new Set(), best = assign1(stus, slots, pick, f, cap, excl, order);
      for (let guard = 0; guard < stus.length; guard++){
        let improved = false;
        for (const h of halves(best)){
          const ex2 = new Set(excl); ex2.add(h);
          const r2 = assign1(stus, slots, pick, f, cap, ex2, order);
          if (r2.full > best.full || (r2.full === best.full && halves(r2).length < halves(best).length)){ best = r2; excl = ex2; improved = true; break; }
        }
        if (!improved) break;
      }
      return repair(stus, slots, pick, best, cap);
    }
    /* 주 2회 손질: 반쪽 배정을 비운 뒤, 못 들어간 학생을 빈 자리에 넣는다.
     * 자리가 차 있으면 그 반의 다른 학생 한 명을 그 학생이 갈 수 있는 빈 반으로 옮겨 자리를 만든다. */
    function repair(stus, slots, pick, r, cap){
      const P = pick.length, got = r.got.map(g => g.length === 2 ? g.slice() : []);
      const load = pick.map(() => 0); got.forEach(g => g.forEach(k => load[k]++));
      const can = (i, k) => stus[i].ok.has(pick[k]);
      const dayK = k => slots[pick[k]].day;
      const free = k => load[k] < cap;
      // 반 k 의 학생 한 명을 다른 빈 반으로 옮긴다(옮길 학생의 나머지 반과 요일이 겹치지 않게, ban 칸은 쓰지 않음).
      // 옮긴 기록을 돌려줘 실패하면 되돌린다. 반마다 학생 목록(mem)을 들고 있어 전원을 훑지 않는다.
      const mem = pick.map(() => []); got.forEach((g, x) => g.forEach(k => mem[k].push(x)));
      const move = (x, from, to) => { const g = got[x]; g[g.indexOf(from)] = to; load[from]--; load[to]++; mem[from].splice(mem[from].indexOf(x), 1); mem[to].push(x); };
      const evict = (k, ban) => {
        for (const x of mem[k]){
          const g = got[x], other = g[0] === k ? g[1] : g[0];
          for (let c = 0; c < P; c++){
            if (c === k || ban.indexOf(c) >= 0 || !free(c) || !can(x, c) || c === other || dayK(c) === dayK(other)) continue;
            move(x, k, c); return [x, k, c];
          }
        }
        return null;
      };
      const place = i => {
        for (let a = 0; a < P; a++){ if (!can(i, a)) continue;
          for (let b = a + 1; b < P; b++){
            if (dayK(a) === dayK(b) || !can(i, b)) continue;
            const log = [];

        // 못 들어간 이유: 고른 칸 중 가능한 칸이 모자람 vs 정원이 차서

    const lines = ['반\t이름\t학교\t학년'];
    p.classes.forEach(c => c.stus.forEach(st => lines.push([c.slot.day + ' ' + slotLabel(c.slot), st.name, st.school, gradeShort(st.grade)].join('\t'))));
    p.left.forEach(x => lines.push(['못 들어감(' + x.why + ')', x.st.name, x.st.school, gradeShort(x.st.grade)].join('\t')));
    navigator.clipboard.writeText(lines.join('\n')).then(() => toast((i + 1) + '안을 복사했어요'), () => toast('복사하지 못했어요'));
  }

  function pickCell(id, sid){ CELL[id] = CELL[id] === sid ? '' : sid; drawList(); }
  function copyRes(id){
    const s = SURVEYS.find(x => x.id === id); if (!s) return;
    const codes = {}; TGTS.filter(t => t.survey_id === id && rfKeep(id, t)).forEach(t => { codes[t.code] = 1; });
    const slots = (s.slots || []).slice().sort(slotSort);
    const head = ['이름', '학교', '학년'].concat(slots.map(x => x.day + ' ' + x.start)).concat(['메모', '마지막 저장']);
    const lines = [head.join('\t')];
    const rs = RESP.filter(r => r.survey_id === id && codes[r.code]).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    rs.forEach(r => { const no = {}; (r.no || []).forEach(k => { no[k] = 1; });
      lines.push([r.name, r.school, gradeShort(r.grade)].concat(slots.map(x => no[x.id] ? 'X' : 'O')).concat([String(r.memo || '').replace(/\s+/g, ' '), r.last_by + ' ' + kst(r.updated_at)]).join('\t')); });
    TGTS.filter(t => t.survey_id === id && codes[t.code] && !rs.some(r => r.code === t.code)).forEach(t => lines.push([t.name, t.school, gradeShort(t.grade)].concat(slots.map(() => '')).concat(['미제출', '']).join('\t')));
    navigator.clipboard.writeText(lines.join('\n')).then(() => toast('표를 복사했어요 — 구글 시트에 붙여 넣으세요'), () => toast('복사하지 못했어요'));
  }

  /* ── 시작 ── */
  fillTimeSel(); drawSlots();
  $('sDue').value = new Date(Date.now() + 9 * 3600e3 + 7 * 864e5).toISOString().slice(0, 10);
  if (window.TeacherAuth && TeacherAuth.ready) TeacherAuth.ready.then(c => { ME = (c && c.profile && c.profile.display_name) || ''; }).catch(() => {});
  sbAll('/students?select=name,school,grade,student_id,code,enrolled&order=seq,id').then(rows => {
    STUS = rows.filter(r => String(r.name || '').trim() && !/^(퇴원|n|no|off|x|중단|비재원)$/i.test(String(r.enrolled || '').trim()))
      .map(r => ({ name: String(r.name).trim(), school: String(r.school || '').trim(), grade: String(r.grade || ''), student_id: String(r.student_id || '').trim(), code: String(r.code || '').trim() }));
    fillPickers(); summary();
  }).catch(() => { $('sum').innerHTML = '<div class="warn">재원 명단을 불러오지 못했어요 — 새로고침해 주세요.</div>'; });
  setMode('stu');
  setBook('정규');
  loadSurveys();
</script>
