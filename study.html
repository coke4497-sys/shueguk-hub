<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>학습 관리 · 슈국 티쳐스</title>
<meta name="description" content="이수경국어 학습 관리 — 어휘·문법 테스트, H WORK, 숙제 검사, 주말 실전모의고사, 클리닉, 지필고사 리포트" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#4C6E66; --btn:#628C83; --icon:#3F4541; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8; --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; padding:0 0 88px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 22px;}

  .back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .back svg{width:16px;height:16px;}
  .back:hover{color:var(--accent);}

  header{padding:18px 4px 30px;text-align:center;}
  .tagline{font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700;color:var(--accent);margin:0;letter-spacing:.01em;}
  .intro{color:var(--ink-soft);font-size:.94rem;margin:10px auto 0;max-width:25em;line-height:1.85;}

  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}   /* 2칸 4줄 (좁은 화면은 1칸) */
  @media (max-width:560px){ .list{grid-template-columns:1fr;gap:14px;} }
  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:18px 18px;text-decoration:none;color:inherit;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:0 10px 26px rgba(42,51,47,.07);}
  .icon{width:48px;height:48px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--icon-bg);color:var(--icon);}
  .icon svg{width:24px;height:24px;}
  /* 파스텔 포인트 — 아이콘 타일에만 색, 도구 성격별 묶음 (2026-08-22 사용자 확정) */
  .card.t-yel .icon{background:#F9EFD0;color:#9B8046;}
  .card.t-pnk .icon{background:#FBE9EF;color:#B06A80;}
  .card.t-lav .icon{background:#EDE4F4;color:#8D83A8;}
  .card.t-mnt .icon{background:#E3EDE7;color:#4C6E66;}
  .body{flex:1;min-width:0;}
  .card h2{font-family:"Gowun Batang",serif;font-size:1.16rem;font-weight:700;margin:0;letter-spacing:-.01em;}
  .card .desc{margin:3px 0 0;color:var(--ink-soft);font-size:.88rem;line-height:1.5;}
  .go{margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-size:.82rem;color:var(--accent);}
  .go svg{width:15px;height:15px;transition:transform .16s ease;}
  .card:hover .go svg{transform:translateX(4px);}

  footer{text-align:center;margin-top:46px;color:var(--ink-soft);font-size:.82rem;line-height:2;}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    티쳐스 메인 페이지로 가기
  </a>

  <header>
    <p class="tagline">학습 관리</p>
    <p class="intro">테스트·과제·모의고사·리포트 관리 메뉴를 선택하세요.</p>
  </header>

  <div class="list" id="list"></div>

  <footer>
    <p>이수경국어 Shueguk · 교사용</p>
  </footer>
</main>

<script>
  const ICON = {
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    clipboard:'<path d="M9 3h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/>',
    paper:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    pulse:'<path d="M22 12h-4l-3 8L9 4l-3 8H2"/>',
    chart:'<line x1="6" y1="21" x2="6" y2="15"/><line x1="12" y1="21" x2="12" y2="9"/><line x1="18" y1="21" x2="18" y2="4"/>',
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'
  };
  const REPORT = "https://coke4497-sys.github.io/shueguk-report/";
  const menus = [
    { title:"어휘 테스트",       icon:"book",      tone:"yel",      url:"voca.html",           desc:"링크 발송 · 결과 확인" },
    { title:"문법 테스트",       icon:"pencil",    tone:"yel",    url:"gramma.html",         desc:"링크 발송 · 결과 확인" },
    { title:"H WORK",            icon:"clipboard", tone:"mnt", url:"hwork.html",          desc:"출제 · 제출 확인" },
    { title:"숙제 검사",         icon:"check",     tone:"mnt",     url:REPORT+"hwcheck.html", desc:"정규 수업 과제 검사 · 미제출 대책" },
    { title:"내신대비 피드백",   icon:"pencil",    tone:"lav",    url:REPORT+"naeshin.html", desc:"내신반 주차별 진도·과제 · 학생 피드백" },
    { title:"주말 실전모의고사", icon:"paper",     tone:"lav",     url:"weekend.html",        desc:"출제 · 응시 · 성적" },
    { title:"지필고사 리포트",   icon:"chart",     tone:"pnk",     url:"report.html",         desc:"제작 · 수정·배정 · 학생작성 확인 · 제출 분석" },
    { title:"클리닉",            icon:"pulse",     tone:"pnk",     url:"clinic.html",         desc:"신청 링크 · 신청 확인" },
  ];
  const svg = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const ARROW = svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
  document.getElementById("list").innerHTML = menus.map(m =>
    `<a class="card${m.tone ? ' t-'+m.tone : ''}" href="${m.url}">
      <span class="icon">${svg(ICON[m.icon])}</span>
      <span class="body"><h2>${m.title}</h2><p class="desc">${m.desc}</p><span class="go">열기 ${ARROW}</span></span>
    </a>`).join("");
</script>
</body>
</html>
