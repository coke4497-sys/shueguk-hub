<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>학습 관리 · 슈국 티쳐스</title>
<script src="assets/teacher-auth.js" data-mode="protected"></script>
<meta name="description" content="이수경국어 학습 관리 — 어휘·문법 테스트, H WORK, 과제 검사, 주말 실전모의고사, 클리닉, 지필고사 리포트" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  /* 2026-10-21 원장님 시안 3b·3c(묶음별 목록 — 한 화면에 모두 보이는 밀도) */
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2b3a33; --ink-soft:#54655c; --dim:#7a8a82;
    --accent:#4C6E66; --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 64px;
  }
  .wrap{max-width:828px;margin:0 auto;padding:0 22px;}

  .back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .back svg{width:16px;height:16px;}
  .back:hover{color:var(--accent);}

  header{padding:22px 20px 22px;}
  .tagline{font-family:"Gowun Batang",serif;font-size:1.75rem;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em;line-height:1.3;}
  .intro{color:var(--ink-soft);font-size:.94rem;margin:6px 0 0;}

  .groups{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 14px;align-items:start;}
  .grp{min-width:0;background:var(--surface);border-radius:var(--radius);padding:18px 16px 10px;}
  .gh{display:flex;align-items:center;gap:8px;margin:0 2px 6px;font-size:.84rem;font-weight:700;color:var(--ink);letter-spacing:.02em;}
  .gh i{width:7px;height:7px;border-radius:50%;flex:none;}
  .row{display:flex;align-items:center;gap:14px;padding:10px 2px;text-decoration:none;color:inherit;border-radius:12px;transition:background .15s ease;}
  .row:hover{background:#F4F7F5;}
  .row + .row{margin-top:2px;}
  .icon{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .icon svg{width:16px;height:16px;}
  .body{flex:1;min-width:0;}
  .row h2{font-size:1rem;font-weight:700;margin:0;line-height:1.4;color:var(--ink);}
  .row .desc{margin:1px 0 0;color:var(--ink-soft);font-size:.78rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chev{flex:none;color:#A6B1AB;}
  .chev svg{width:15px;height:15px;transition:transform .15s ease;}
  .row:hover .chev svg{transform:translateX(3px);}
  /* 묶음 색 — 점과 아이콘 타일 */
  .g-test .gh i{background:#8A6A35;} .g-test .icon{background:#F7ECC4;color:#806423;}
  .g-work .gh i{background:#3d6870;} .g-work .icon{background:#DBEEF0;color:#3d6870;}
  .g-class .gh i{background:#4a4266;} .g-class .icon{background:#E6E2F2;color:#4a4266;}
  .g-mock .gh i{background:#6E5A8C;} .g-mock .icon{background:#ECE4F3;color:#6E5A8C;}
  .g-clinic .gh i{background:#9a4a55;} .g-clinic .icon{background:#F6DDE0;color:#9a4a55;}

  footer{text-align:center;margin-top:40px;color:var(--ink-soft);font-size:.82rem;line-height:2;}
  @media (max-width:640px){
    .wrap{padding:0 14px;}
    header{padding:18px 6px 16px;}
    .tagline{font-size:1.5rem;}
    .groups{grid-template-columns:minmax(0,1fr);gap:12px;}
    .grp{padding:14px 12px 6px;}
    .row{padding:8px 2px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    티쳐스 메인 페이지로 가기
  </a>

  <header>
    <h1 class="tagline">학습 관리</h1>
    <p class="intro">테스트·과제·모의고사·리포트 관리 메뉴를 선택하세요.</p>
  </header>

  <div class="groups" id="list"></div>

  <footer>
    <p>이수경국어 Shueguk · 교사용</p>
  </footer>
</main>

<script>
  const ICON = {
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    clipboard:'<path d="M9 3h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/>',
    paper:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    pulse:'<path d="M22 12h-4l-3 8L9 4l-3 8H2"/>',
    chart:'<line x1="6" y1="21" x2="6" y2="15"/><line x1="12" y1="21" x2="12" y2="9"/><line x1="18" y1="21" x2="18" y2="4"/>',
    play:'<rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z"/>'
  };
  const REPORT = "https://coke4497-sys.github.io/shueguk-report/";
  // 묶음별 목록 (2026-10-21 원장님 시안) — 넓은 화면은 2열(테스트|과제·복습 / 수업·피드백|모의고사·리포트 / 클리닉), 휴대폰은 1열
  const groups = [
    { key:"test", name:"테스트", items:[
      { title:"어휘 테스트", icon:"book", url:"voca.html", desc:"링크 발송 · 결과 확인" },
      { title:"문법 테스트", icon:"pencil", url:"gramma.html", desc:"링크 발송 · 결과 확인" } ]},
    { key:"work", name:"과제 · 복습", items:[
      { title:"H WORK", icon:"clipboard", url:"hwork.html", desc:"출제 · 제출 확인" },
      { title:"복습 영상", icon:"play", url:"review.html", desc:"유튜브 복습 영상 배정 · 학생별 시청 시간" } ]},
    { key:"class", name:"수업 · 피드백", items:[
      { title:"수업 기록 보기", icon:"paper", url:REPORT+"classlog.html", desc:"반별 수업 기록·과제 검사 · 칭찬·요주의 슈퍼스타" },
      { title:"내신대비 피드백", icon:"pencil", url:REPORT+"naeshin.html", desc:"내신반 주차별 진도·과제 · 학생 피드백" } ]},
    { key:"mock", name:"모의고사 · 리포트", items:[
      { title:"주말 실전모의고사", icon:"paper", url:"weekend.html", desc:"출제 · 응시 · 성적" },
      { title:"교육청, 평가원 모의고사 리포트", icon:"chart", url:"smock.html", desc:"학교 모의고사 회차 열기 · 학생 입력 결과 · 설문 응답 옮겨 오기" },
      { title:"지필고사 리포트", icon:"chart", url:"report.html", desc:"제작 · 수정·배정 · 학생작성 확인 · 제출 분석" } ]},
    { key:"clinic", name:"클리닉", items:[
      { title:"클리닉", icon:"pulse", url:"clinic.html", desc:"배정 · 신청 확인 · 질문 대기열" } ]},
  ];
  const svg = (inner, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const CHEV = svg('<path d="M9 6l6 6-6 6"/>', 2);
  document.getElementById("list").innerHTML = groups.map(g =>
    `<section class="grp g-${g.key}" aria-label="${g.name}"><div class="gh"><i></i>${g.name}</div>` +
    g.items.map(m => `<a class="row" href="${m.url}">
      <span class="icon">${svg(ICON[m.icon])}</span>
      <span class="body"><h2>${m.title}</h2><p class="desc" title="${m.desc}">${m.desc}</p></span>
      <span class="chev">${CHEV}</span>
    </a>`).join("") + `</section>`).join("");
</script>
</body>
</html>
