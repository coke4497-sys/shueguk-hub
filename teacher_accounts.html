<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 계정 관리 · 슈국 티쳐스</title>
<script src="assets/teacher-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root{--bg:#C6D5D2;--surface:#fff;--ink:#2A332F;--soft:#65726B;--accent:#4C6E66;--line:#D7E3DD;--lav:#EDE4F4;--lav-ink:#5A4A6A;--ok:#3E755F;--error:#9A4E4E}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;padding:40px 20px;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif}
  main{width:min(100%,720px);margin:auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
  .brand{margin:0;font-family:"Sacramento",cursive;font-size:3.2rem;font-weight:400;line-height:1}
  .home{color:var(--accent);text-decoration:none;font-size:.9rem}
  .card{padding:30px;border:1px solid rgba(255,255,255,.7);border-radius:24px;background:var(--surface);box-shadow:0 18px 48px rgba(42,51,47,.12)}
  h1{margin:0 0 8px;font:700 1.35rem/1.4 "Gowun Batang",serif;color:var(--accent)}
  .intro{margin:0 0 25px;color:var(--soft);font-size:.9rem;line-height:1.7}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;color:var(--soft);font-size:.85rem}
  input{display:block;width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:16px/1.3 inherit;outline:none}
  input:focus{border-color:#8D83A8;box-shadow:0 0 0 3px rgba(141,131,168,.14)}
  button{border:0;border-radius:12px;padding:13px 18px;background:var(--lav);color:var(--lav-ink);font:700 15px/1.3 "Gowun Batang",serif;cursor:pointer}
  button:hover{background:#E3D7EE}
  button:disabled{opacity:.65;cursor:wait}
  .submit{width:100%;margin-top:20px}
  .msg{min-height:24px;margin:13px 0 0;color:var(--error);text-align:center;font-size:.85rem}
  .result{display:none;margin-top:24px;padding:22px;border:1px solid #CFE1D8;border-radius:16px;background:#F5FAF7}
  .result.show{display:block}
  .result h2{margin:0 0 7px;color:var(--ok);font:700 1.05rem/1.4 "Gowun Batang",serif}
  .result p{margin:6px 0;color:var(--soft);font-size:.9rem}
  .credentials{margin:16px 0;padding:15px;border-radius:12px;background:#fff;border:1px solid var(--line);font-family:Consolas,"Courier New",monospace;line-height:1.8;word-break:break-all}
  .copy{width:100%}
  .notice{margin:16px 0 0;color:var(--soft);font-size:.8rem;line-height:1.65}
  @media(max-width:560px){body{padding:25px 14px}.card{padding:24px 20px}.grid{grid-template-columns:1fr}.brand{font-size:2.8rem}}
</style>
</head>
<body>
<main>
  <div class="top"><p class="brand">Shueguk</p><a class="home" href="index.html">메인으로</a></div>
  <section class="card" id="accountPanel" hidden>
    <h1>교사 계정 발급</h1>
    <p class="intro">교사 아이디와 표시 이름을 입력하면 안전한 임시 비밀번호를 자동으로 생성합니다.</p>
    <form id="accountForm" novalidate>
      <div class="grid">
        <label>교사 아이디
          <input id="loginId" name="username" type="text" placeholder="예: teacher.kim" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>표시 이름
          <input id="displayName" type="text" placeholder="예: 박보검" autocomplete="off" maxlength="40" required>
        </label>
      </div>
      <button class="submit" id="submitBtn" type="submit">아이디와 임시 비밀번호 발급</button>
      <p class="msg" id="message" role="alert" aria-live="polite"></p>
    </form>
    <section class="result" id="result" aria-live="polite">
      <h2>계정이 발급되었습니다</h2>
      <p>아래 내용을 해당 선생님에게 안전하게 전달하십시오.</p>
      <div class="credentials" id="credentials"></div>
      <button class="copy" id="copyBtn" type="button">계정 정보 복사</button>
      <p class="notice">임시 비밀번호는 이 화면을 벗어나면 다시 확인할 수 없습니다. 메신저 단체방이나 공개 문서에는 공유하지 마십시오.</p>
    </section>
  </section>
</main>
<script>
  (function(){
    var panel = document.getElementById('accountPanel');
    var form = document.getElementById('accountForm');
    var loginId = document.getElementById('loginId');
    var displayName = document.getElementById('displayName');
    var button = document.getElementById('submitBtn');
    var message = document.getElementById('message');
    var result = document.getElementById('result');
    var credentials = document.getElementById('credentials');
    var copyButton = document.getElementById('copyBtn');
    var copyText = '';

    TeacherAuth.ready.then(function(context){
      if (!context || context.profile.role !== 'admin') {
        location.replace('index.html');
        return;
      }
      panel.hidden = false;
    });

    form.addEventListener('submit', function(event){
      event.preventDefault();
      message.textContent = '';
      result.classList.remove('show');
      button.disabled = true;
      button.textContent = '발급 중…';
      fetch(TeacherAuth.config.url + '/functions/v1/create-teacher', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginId: loginId.value, displayName: displayName.value })
      }).then(function(response){
        return response.json().catch(function(){ return {}; }).then(function(data){
          if (!response.ok) throw new Error(data.error || '계정을 발급하지 못했습니다.');
          return data.account;
        });
      }).then(function(account){
        copyText = '교사 아이디: ' + account.loginId + '\n임시 비밀번호: ' + account.temporaryPassword;
        credentials.textContent = copyText;
        result.classList.add('show');
        form.reset();
      }).catch(function(error){
        message.textContent = error && error.message ? error.message : '계정을 발급하지 못했습니다.';
      }).finally(function(){
        button.disabled = false;
        button.textContent = '아이디와 임시 비밀번호 발급';
      });
    });

    copyButton.addEventListener('click', function(){
      navigator.clipboard.writeText(copyText).then(function(){
        copyButton.textContent = '복사했습니다';
        setTimeout(function(){ copyButton.textContent = '계정 정보 복사'; }, 1800);
      }).catch(function(){
        message.textContent = '복사하지 못했습니다. 화면의 계정 정보를 직접 복사하십시오.';
      });
    });
  })();
</script>
</body>
</html>
