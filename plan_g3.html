<!--
  27 예상 고3 시간표 (2026-10-24 원장님 "27예상 고3 시간표를 티쳐스 페이지에 비공개로 만들어서 정리를 도와줘"
  + "진도, 확인 내신 시간표 그대로. 그리고 그걸 1안, 2안 이런 식으로 변경하며 진행하려고 해")
  · 보는 사람 = 원장님(admin) + PLAN_VIEWERS(박언호 대표님) — 화면에서만 가린다(표 권한은 다른 교사 표와 같다).
  · 안마다 tt_plan_config 한 줄(plan '27고3-1', '27고3-2' …, open 은 늘 false — 학생 신청과 무관) + tt_plan_students
    학생마다 한 줄(ga = 진도 반 ID, na = 확인 반 ID). 반 목록은 config.classes, 그 안의 id '__meta' 한 칸이 안 메모.
  · 실제 시간표(tt_classes)·명단은 건드리지 않는다. 마이그레이션 변경 없음(052·053 표를 그대로 쓴다).

<style>

  <h1>27 예상 고3 시간표</h1>
  <p class="intro">지금 고2 내신 시간표(진도·확인)를 그대로 옮겨 시작합니다. 1안·2안처럼 안을 나눠 반을 합치거나 옮겨 보세요. 실제 시간표와 학생 페이지에는 아무것도 바뀌지 않아요.</p>

<script>
/* PLAN-G3-CORE — 시간·이름·학교·안 만들기 규칙. tools/plan-g3-e2e-test.js 가 이 블록을 따로 떼어 검사한다. */
var PG = (function(){
  var DAYS = '월화수목금토일';
  function mins(t){   // '5:30'·'11:00'·'12:30'·'오전9:30'·'밤10:00' → 분 (timetable.html mins 와 같은 규칙)
    var s = String(t || '').trim(), am = s.indexOf('오전') === 0, night = s.indexOf('밤') === 0;
    var p = s.replace(/^(오전|밤)\s*/, '').split(':'), h = parseInt(p[0], 10) || 0, m = parseInt(p[1], 10) || 0;
    if (am) return (h === 12 ? 0 : h) * 60 + m;
    if (night) return (h === 12 ? 24 : h + 12) * 60 + m;
    if (h < 10) h += 12;
    return h * 60 + m;
  }
  function span(c){ var s = mins(c.start), e = mins(c.end); if (e <= s) e += 12 * 60; return [s, e]; }
  function okTime(t){ return /^(오전|밤)?\s*\d{1,2}:\d{2}$/.test(String(t || '').trim()); }
  function plain(t){ return String(t || '').replace(/\([^)]*\)/g, '').trim(); }
  function schoolOf(tok, clsName){   // 확인 반 이름표 '(화수)' → 화수고, 없으면 진도 반 이름 '고2 화수A(…)' → 화수고
    var m = /\(([^)]+)\)\s*$/.exec(String(tok || ''));
    var b = m && !/\d/.test(m[1]) ? m[1] : '';
    if (!b){ var k = /고[23]\s+([가-힣]+?)[A-Z]?(\(|$)/.exec(String(clsName || '')); b = k ? k[1] : ''; }
    b = b.replace(/(고등학교|고)$/, '');
    return b ? b + '고' : '';
  }
  function overlap(a, b){ if (!a || !b || a.day !== b.day) return false; var x = span(a), y = span(b); return x[0] < y[1] && y[0] < x[1]; }
  function sortCls(a, b){ return DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || mins(a.start) - mins(b.start) || (a.part < b.part ? -1 : a.part > b.part ? 1 : 0) || String(a.teacher).localeCompare(String(b.teacher)); }
  // 지금 내신 시간표(tt_classes book=내신)에서 고2 반 → 27 고3 반·학생
  function fromNaeshin(rows){
    var classes = [], st = {}, order = [];
    rows.filter(function(c){ return /고2/.test(c.name || '') && !/^w/.test(c.class_id || ''); }).forEach(function(c){
      var part = /확인/.test(c.name) ? '확인' : '진도';
      var k = { id: c.class_id, part: part, name: String(c.name).replace('고2', '고3'), day: c.day, start: c.start_time, end: c.end_time,
                loc: c.location || '', teacher: c.teacher || '', from: c.class_id };
      classes.push(k);
      String(c.roster || '').split(/\s+/).filter(Boolean).forEach(function(tok){
        var nm = plain(tok); if (!nm) return;
        var s = st[nm]; if (!s){ s = st[nm] = { student: nm, school: '', ga: '', na: '', src: [] }; order.push(nm); }
        if (part === '진도'){ if (!s.ga) s.ga = k.id; } else { if (!s.na) s.na = k.id; }
        if (!s.school) s.school = schoolOf(tok, part === '진도' ? c.name : '');
        s.src.push(part + ' ' + k.day + k.start + ' ' + k.teacher + 'T ' + c.name);
      });

    busy(true);
    return api('/tt_plan_config', { method: 'POST', prefer: 'return=minimal', body: JSON.stringify(cfg) })
      .then(function(){ return rows.length ? api('/tt_plan_students', { method: 'POST', prefer: 'return=minimal', body: JSON.stringify(rows) }) : null; })
      .then(function(){ CUR = key; SEL = ''; toast(noOf(key) + '안을 만들었습니다'); return load(); })
      .catch(fail).then(function(){ busy(false); });
  }
  function newFromBase(){
    if (BUSY) return;
    api('/tt_classes?book=eq.' + enc('내신') + '&class_id=not.like.w*&select=class_id,day,start_time,end_time,location,teacher,name,roster&limit=2000').then(function(rows){
      var b = PG.fromNaeshin(rows || []);
      if (!b.classes.length) return toast('내신 시간표에 고2 반이 없습니다');
      if (!confirm('지금 내신 시간표의 고2 반 ' + b.classes.length + '개(진도·확인)와 학생 ' + b.students.length + '명으로 새 안을 만들까요?')) return;
      return createPlan(b.classes, b.students, '', today() + ' 내신 시간표(고2 진도·확인) 그대로');
    }).catch(fail);
  }
  function newCopy(){
    var p = plan(); if (!p || BUSY) return;
    if (!confirm(noOf(p.plan) + '안을 그대로 복사해 ' + nextNo() + '안을 만들까요?')) return;
    createPlan(clsOf(p).map(function(c){ return JSON.parse(JSON.stringify(c)); }), rowsOf(p.plan), metaOf(p).memo, today() + ' ' + noOf(p.plan) + '안에서 복사', p.cap);
  }
  function delPlan(){
    var p = plan(); if (!p || BUSY) return;
    if (!confirm(noOf(p.plan) + '안을 지울까요? 이 안의 반·학생 배치가 모두 사라집니다. 다른 안과 실제 시간표는 그대로예요.')) return;
    busy(true);
    api('/tt_plan_students?plan=eq.' + enc(p.plan), { method: 'DELETE' }).then(function(){ return api('/tt_plan_config?plan=eq.' + enc(p.plan), { method: 'DELETE' }); })
      .then(function(){ CUR = ''; SEL = ''; toast(noOf(p.plan) + '안을 지웠습니다'); return load(); }).catch(fail).then(function(){ busy(false); });
  }

  // ── 반 고치기 창 ─────────────────────────────
  $('dDay').innerHTML = PG.DAYS.split('').map(function(d){ return '<option>' + d + '</option>'; }).join('');
  function dPart(v){ Array.prototype.forEach.call(document.querySelectorAll('[data-dpart]'), function(b){ b.classList.toggle('on', b.getAttribute('data-dpart') === v); }); EDIT.part = v; }
  function openEdit(id){
    var p = plan(), c = id ? clsOf(p).filter(function(x){ return x.id === id; })[0] : null;
    EDIT = c ? JSON.parse(JSON.stringify(c)) : { id: '', part: PART || '확인', name: '고3 확인', day: '수', start: '5:30', end: '7:00', teacher: TF || '', loc: '민트초코' };
    $('dlgT').textContent = c ? '반 고치기' : '반 추가';
    dPart(EDIT.part);
    $('dName').value = EDIT.name || ''; $('dDay').value = EDIT.day; $('dStart').value = EDIT.start; $('dEnd').value = EDIT.end; $('dT').value = EDIT.teacher || ''; $('dLoc').value = EDIT.loc || '';
    var n = c ? rowsOf(CUR).filter(function(r){ return r.ga === c.id || r.na === c.id; }).length : 0;
    $('dDel').hidden = !c;
    $('dNote').textContent = c ? '학생 ' + n + '명' + (c.from ? ' · 지금 내신 반 ' + c.from + '에서 옮겨 옴' : '') : '시간은 5:30·11:00처럼 적습니다(오전 9시 반은 오전9:30).';
    $('dlg').showModal();
  }
  function saveEdit(){
    var e = EDIT, v = { part: e.part, name: $('dName').value.trim(), day: $('dDay').value, start: $('dStart').value.trim(), end: $('dEnd').value.trim(), teacher: $('dT').value.trim().replace(/T$/, ''), loc: $('dLoc').value.trim() };
    if (!v.name) return toast('반 이름을 적어 주세요');
    if (!PG.okTime(v.start) || !PG.okTime(v.end)) return toast('시간은 5:30처럼 적어 주세요');
    var p = plan(), cls = clsOf(p), meta = metaOf(p), was = cls.filter(function(x){ return x.id === e.id; })[0];
    if (was && was.part !== v.part && rowsOf(CUR).some(function(r){ return r.ga === e.id || r.na === e.id; })) return toast('학생이 있는 반은 진도·확인을 바꿀 수 없습니다. 학생을 먼저 옮겨 주세요');
    var nc;
    if (was) nc = cls.map(function(x){ if (x.id !== e.id) return x; var y = JSON.parse(JSON.stringify(x)); for (var k in v) y[k] = v[k]; return y; });
    else { v.id = 'c' + Date.now().toString(36); nc = cls.concat([v]); }
    nc.sort(PG.sortCls);
    busy(true);
    saveConfig(nc.concat([meta])).then(function(){ $('dlg').close(); toast(was ? '반을 고쳤습니다' : '반을 더했습니다'); render(); }).catch(fail).then(function(){ busy(false); });
  }
  function delEdit(){
    var e = EDIT, p = plan(), list = rowsOf(CUR).filter(function(r){ return r.ga === e.id || r.na === e.id; });
    if (!confirm('‘' + e.name + '’ 반을 지울까요?' + (list.length ? ' 학생 ' + list.length + '명은 미배치로 돌아갑니다.' : ''))) return;
    var f = e.part === '진도' ? 'ga' : 'na', body = { author: ME, updated_at: nowIso() }; body[f] = '';
    busy(true);
    (list.length ? api('/tt_plan_students?plan=eq.' + enc(CUR) + '&' + f + '=eq.' + enc(e.id), { method: 'PATCH', prefer: 'return=minimal', body: JSON.stringify(body) }) : Promise.resolve())
      .then(function(){ return saveConfig(clsOf(p).filter(function(x){ return x.id !== e.id; }).concat([metaOf(p)])); })
      .then(function(){ $('dlg').close(); toast('반을 지웠습니다'); return load(); }).catch(fail).then(function(){ busy(false); });
  }

  // ── 표 복사 ─────────────────────────────
  function copyTable(){
    var p = plan(), cls = clsOf(p).slice().sort(PG.sortCls), rows = rowsOf(CUR);
    var out = [['안', '구분', '요일', '시간', '담당', '반', '장소', '인원', '학생'].join('\t')];
    cls.forEach(function(c){
      var st = rows.filter(function(r){ return !r.excluded && (r.ga === c.id || r.na === c.id); }).map(function(r){ return r.student; }).sort();
      out.push([noOf(p.plan) + '안', c.part, c.day, c.start + '~' + c.end, c.teacher + 'T', c.name, c.loc || '', st.length, st.join(' ')].join('\t'));
    });
    var txt = out.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ toast('표를 복사했습니다 — 구글 시트에 붙여 넣으세요'); }, function(){
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('표를 복사했습니다'); } catch(_){ toast('복사하지 못했습니다'); } ta.remove();
    });
  }

  // ── 이벤트 ─────────────────────────────
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-zday],[data-plan],[data-st],[data-edit],[data-cls],[data-unset],[data-unsel],[data-part],[data-dpart]');
    if (!$('newBtn').contains(ev.target)) $('newPop').hidden = true;
    if (!t) return;
    if (t.hasAttribute('data-zday')){ VIEW = t.getAttribute('data-zday'); try { sessionStorage.setItem('pg3_view', VIEW); } catch(_){} render(); window.scrollTo(0, $('days').getBoundingClientRect().top + window.scrollY - 60); return; }
    if (t.hasAttribute('data-plan')){ CUR = t.getAttribute('data-plan'); SEL = ''; render(); return; }
    if (t.hasAttribute('data-dpart')){ dPart(t.getAttribute('data-dpart')); return; }
    if (t.hasAttribute('data-part')){ PART = t.getAttribute('data-part'); render(); return; }
    if (t.hasAttribute('data-unsel')){ SEL = ''; render(); return; }
    if (t.hasAttribute('data-unset')){
      var f = t.getAttribute('data-unset'), nm = SEL; if (!nm || BUSY) return;
      busy(true); setStudent(nm, f, '').then(function(){ toast(nm + ' ' + (f === 'ga' ? '진도' : '확인') + ' 반에서 뺐습니다'); render(); }).catch(fail).then(function(){ busy(false); });
      return;
    }
    if (t.hasAttribute('data-edit')){ openEdit(t.getAttribute('data-edit')); return; }
    if (t.hasAttribute('data-st')){ var s = t.getAttribute('data-st'); SEL = SEL === s ? '' : s; render(); return; }
    if (t.hasAttribute('data-cls')){
      if (SEL) moveTo(t.getAttribute('data-cls'));
      else if (!VIEW){ var c0 = clsOf(plan()).filter(function(x){ return x.id === t.getAttribute('data-cls'); })[0]; if (c0){ VIEW = c0.day; try { sessionStorage.setItem('pg3_view', VIEW); } catch(_){} render(); } }
    }
  });
  $('newBtn').onclick = function(){ $('newPop').hidden = !$('newPop').hidden; };
  $('newCopy').onclick = function(){ $('newPop').hidden = true; newCopy(); };
  $('newBase').onclick = function(){ $('newPop').hidden = true; newFromBase(); };
  $('delPlan').onclick = delPlan;
  $('addCls').onclick = function(){ openEdit(''); };
  $('copyTbl').onclick = copyTable;
  $('tf').onchange = function(){ TF = this.value; render(); };
  $('q').oninput = function(){ Q = this.value.trim(); render(); };
  $('dOk').onclick = saveEdit; $('dDel').onclick = delEdit; $('dCancel').onclick = function(){ $('dlg').close(); };
  $('memo').onchange = function(){
    var p = plan(); if (!p) return; var m = metaOf(p); m = JSON.parse(JSON.stringify(m)); m.memo = this.value.trim();
    saveConfig(clsOf(p).concat([m])).then(function(){ toast('메모를 저장했습니다'); render(); }).catch(fail);
  };
  $('cap').onchange = function(){
    var p = plan(), v = parseInt(this.value, 10); if (!p || !(v > 0)) return;
    saveConfig(p.classes, { cap: v }).then(function(){ render(); }).catch(fail);
  };
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && SEL && !$('dlg').open){ SEL = ''; render(); } });

  TeacherAuth.ready.then(function(ctx){
    var p = ctx.profile;
    if (!(p.role === 'admin' || PLAN_VIEWERS.indexOf(p.login_id) >= 0)){ $('deny').hidden = false; return; }
    ME = p.display_name || p.login_id || '';
    $('app').hidden = false;
    load();
  });
})();
</script>
</body>
</html>
