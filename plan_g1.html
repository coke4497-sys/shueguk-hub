<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// timetable.html mins·plainName 과 같은 규칙
function mins(t){
  var s = String(t||'').trim(), am = s.indexOf('오전') === 0, night = s.indexOf('밤') === 0;
  var p = s.replace(/^(오전|밤)\s*/, '').split(':'), h = parseInt(p[0],10)||0, m = parseInt(p[1],10)||0;
  if (am) return (h === 12 ? 0 : h)*60 + m;

  if (h < 10) h += 12;

}

/* ── 27 예상 정규 시간표 — 예비 고1 반 배치 (2026-10-17 원장님 "전체 시간표처럼, 학생 배치가 가능하도록" + "원장님만 보기", 052) ──
 * 반은 아래 P27_SLOTS에 고정(화정센터 강의실 3실, 수·목·금 저녁 2칸 + 토·일 4칸, 선생님마다 가 7 + 나 7).
 * 원칙: 선생님마다·요일마다 가와 나를 둘 다 둔다(어느 두 요일만 와도 같은 선생님의 가·나), 토·일 같은 시간은 가·나를 뒤집는다.
 * 학생 배치는 tt_plan_students(plan '2027')에만 쌓는다 — 실제 시간표(tt_classes)·명단은 건드리지 않는다.
 * 원장님(admin)·P27_VIEWERS 계정(박언호 대표님)만 — 허브 로그인(TeacherAuth.ready) 역할로 화면에서만 가린다. */
var P27_PLAN = '2027';
var P27_CAP = 9;
var P27_DAYS = ['수','목','금','토','일'];
var P27_T = [['지원','김지원T'],['승연','이승연T'],['사명','김사명T']];   // 표시 순서 = 지원·승연·사명(2026-10-17 원장님)
// [요일, 시작, 끝, 시작 분, {선생님: '가'|'나'}] — 일요일은 토요일을 가·나 뒤집어 만든다
var P27_SLOTS = (function(){
  var s = [
    // 수·목·금은 하루 가 2·나 2 — 요일마다 선생님 한 분 쉼(수 승연·목 사명·금 지원, 2026-10-17 원장님 "수목금 가나 각 2개씩").
    // 이 조합이어야 같은 시간 칸에 가·나가 섞이고, 먼저 배치한 금 8:00 사명T 반도 남는다.
    ['수','5:30','7:30',1050,{지원:'나',사명:'가'}], ['수','8:00','10:00',1200,{지원:'가',사명:'나'}],
    ['목','5:30','7:30',1050,{승연:'나',지원:'가'}], ['목','8:00','10:00',1200,{승연:'가',지원:'나'}],
    ['금','5:30','7:30',1050,{승연:'가',사명:'나'}], ['금','8:00','10:00',1200,{승연:'나',사명:'가'}],
    // 토 4:30 지원T는 가(2026-10-17 원장님 "토4:30에 가 반을 추가" — 지금 중3 토 4:30 반이 둘이라). 일 4:30 지원T는 뒤집혀 나.
    ['토','11:00','1:00',660,{승연:'가',지원:'나',사명:'가'}], ['토','1:30','3:30',810,{승연:'나',지원:'가',사명:'나'}],
    ['토','4:30','6:30',990,{승연:'가',지원:'가',사명:'나'}], ['토','7:00','9:00',1140,{승연:'나',지원:'가',사명:'가'}]
  ];
  s.filter(function(x){ return x[0]==='토'; }).forEach(function(x){
    var f = {}; for (var t in x[4]) f[t] = x[4][t]==='가' ? '나' : '가';
    s.push(['일', x[1], x[2], x[3], f]);
  });
  return s;
})();
var P27_CLASSES = [];
P27_SLOTS.forEach(function(x){
  P27_T.forEach(function(t){
    if (!x[4][t[0]]) return;   // 그 요일 쉬는 선생님
    P27_CLASSES.push({ id: x[0] + x[1] + '-' + t[0], day: x[0], start: x[1], end: x[2], m: x[3], teacher: t[0], tname: t[1], part: x[4][t[0]] });
  });
});
var P27_BY = {}; P27_CLASSES.forEach(function(c){ P27_BY[c.id] = c; });
var p27Admin = null;         // null = 확인 중
var P27 = { st: {}, loaded: false, loading: false, err: '', missing: false, sel: null, tf: 'all', q: '', showOut: false,
            cfg: null, cfgMissing: false, log: [], showLog: false, cfgBusy: false };
try { P27.tf = sessionStorage.getItem('tt_p27_tf') || 'all'; } catch (e) {}
var P27_SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
var P27_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
function p27Hdr(x){ var h = { apikey: P27_KEY, 'Content-Type': 'application/json' }; for (var k in (x||{})) h[k] = x[k]; return h; }

// 원장님(admin) + 따로 허용한 계정 — 박언호 대표님(parkeh, 2026-10-17 원장님 "박언호 대표님도 볼 수 있게")
var P27_VIEWERS = ['parkeh'];
function p27SrcLabel(c){ return c.day + ' ' + c.start_time + ' ' + c.teacher + 'T'; }
function p27Load(){
  bootKicked.p27 = true;
  if (P27.loading) return;
  P27.loading = true; P27.err = '';
  var rosterP = p27Get('/tt_classes?book=eq.' + encodeURIComponent('정규') + '&class_id=not.like.w*&select=class_id,day,start_time,teacher,name,roster');
  var stuP = p27Get('/students?select=name,school,grade,enrolled').catch(function(){ return []; });
  var planP = p27Get('/tt_plan_students?plan=eq.' + P27_PLAN + '&select=*').catch(function(e){ if (e.missing){ P27.missing = true; return []; } throw e; });
  // 학생 신청(053) — 설정 한 줄 + 최근 학생 신청 기록. 053 전이면 없음으로 둔다.
  P27.cfgMissing = false;
  var cfgP = p27Get('/tt_plan_config?plan=eq.' + P27_PLAN + '&select=plan,open,cap,updated_at,author')
    .then(function(d){ return d[0] || null; }).catch(function(e){ if (e.missing) P27.cfgMissing = true; return null; });
  var logP = p27Get('/tt_plan_log?plan=eq.' + P27_PLAN + '&order=at.desc&limit=40&select=at,student,part,from_cls,to_cls,by').catch(function(){ return []; });
  cfgP.then(function(c){ P27.cfg = c; });
  logP.then(function(l){ P27.log = l || []; });
  Promise.all([rosterP, stuP, planP, cfgP, logP]).then(function(a){
    var schoolOf = {};
    a[1].forEach(function(s){ var n = String(s.name||'').trim(); if (n && !schoolOf[n]) schoolOf[n] = s.school || ''; });
    var st = {};

      (open ? '신청 마감' : '학생 신청 받기 시작') + '</button>';
  if (P27.log.length){
    h += '<button type="button" class="p27-link" id="p27-logtog">최근 학생 신청 ' + P27.log.length + '건 ' + (P27.showLog ? '접기' : '보기') + '</button>';
    if (P27.showLog){
      var lab = function(id){ var c = P27_BY[id]; return c ? p27ClsLabel(c) : (id ? id : '없음'); };
      h += '<ul class="p27-log">' + P27.log.map(function(l){
        return '<li><span>' + p27LogTime(l.at) + '</span> <b>' + esc(l.student) + '</b> ' + esc(l.part) + ' · ' + esc(lab(l.from_cls)) + ' → ' + esc(lab(l.to_cls)) + '</li>';
      }).join('') + '</ul>';
    }
  }
  return h + '</div>';
}
function p27Hilite(root){
  var q = String(P27.q || '').trim();
  root.querySelectorAll('.p27-chip[data-p27s]').forEach(function(b){ b.classList.toggle('hit', !!q && b.getAttribute('data-p27s').indexOf(q) >= 0); });
}
function p27Click(e){
  var t = e.target;
  var tf = t.closest('[data-p27t]');
  if (tf){ P27.tf = tf.getAttribute('data-p27t'); try { sessionStorage.setItem('tt_p27_tf', P27.tf); } catch (x) {} render(); return; }
  if (t.closest('#p27-reload')){ P27.loaded = false; bootKicked.p27 = false; render(); return; }
  if (t.closest('#p27-outtog')){ P27.showOut = !P27.showOut; render(); return; }
  if (t.closest('#p27-logtog')){ P27.showLog = !P27.showLog; render(); return; }
  var ob = t.closest('[data-p27open]');
  if (ob){ p27SetOpen(ob.getAttribute('data-p27open') === '1'); return; }
  var rb = t.closest('[data-p27r]');
  if (rb){ p27Set(rb.getAttribute('data-p27r'), { excluded: false }); return; }
  var xb = t.closest('[data-p27x]');
  if (xb){
    var k = xb.getAttribute('data-p27x'), nm = P27.sel;
    if (k === 'cancel'){ P27.sel = null; render(); return; }
    if (!nm) return;
    if (k === 'ga') p27Set(nm, { ga: '' });
    else if (k === 'na') p27Set(nm, { na: '' });
    else if (k === 'out'){ P27.sel = null; p27Set(nm, { excluded: true }); }
    return;
  }
  var ch = t.closest('[data-p27s]');
  if (ch){ e.stopPropagation(); var n = ch.getAttribute('data-p27s'); P27.sel = (P27.sel === n) ? null : n; render(); return; }
  var cd = t.closest('[data-p27c]');
  if (cd && P27.sel){
    var c = P27_BY[cd.getAttribute('data-p27c')], o = P27.st[P27.sel];
    if (!c || !o) return;
    var key = c.part === '가' ? 'ga' : 'na';
    if (o[key] === c.id){ P27.sel = null; render(); return; }
    var patch = {}; patch[key] = c.id;
    var nm2 = o.name;
    P27.sel = null;
    p27Set(nm2, patch);
    var cnt = p27Count(c.id);
    if (cnt > P27_CAP) setStatus(p27ClsLabel(c) + ' 반이 ' + cnt + '명으로 정원 9명을 넘었어요.', 'err');
  }
}

TeacherAuth.ready.then(function(ctx){
  var p = ctx.profile;
  alimBy = p.display_name || '';
  p27Admin = (p.role === 'admin' || P27_VIEWERS.indexOf(p.login_id) >= 0);
  render();
});
</script>
