<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 로그인 · 슈국 티쳐스</title>
<script src="assets/teacher-auth.js" data-mode="login"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root{--bg:#C6D5D2;--surface:#fff;--ink:#2A332F;--soft:#65726B;--accent:#4C6E66;--line:#D7E3DD;--lav:#EDE4F4;--lav-ink:#5A4A6A}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif}
  .card{width:min(100%,420px);padding:34px 30px 30px;border:1px solid rgba(255,255,255,.7);border-radius:24px;background:var(--surface);box-shadow:0 18px 48px rgba(42,51,47,.12)}
  .brand{margin:0;text-align:center;font-family:"Sacramento",cursive;font-size:3.7rem;font-weight:400;line-height:1;color:var(--ink)}
  h1{margin:14px 0 8px;text-align:center;font-family:"Gowun Batang",serif;font-size:1.25rem;color:var(--accent)}
  .intro{margin:0 0 25px;text-align:center;color:var(--soft);font-size:.92rem;line-height:1.7}
  label{display:block;margin:0 0 16px;color:var(--soft);font-size:.85rem}
  input{display:block;width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:16px/1.3 inherit;outline:none}
  input:focus{border-color:#8D83A8;box-shadow:0 0 0 3px rgba(141,131,168,.14)}
  button{width:100%;margin-top:3px;padding:13px;border:0;border-radius:12px;background:var(--lav);color:var(--lav-ink);font:700 15px/1.3 "Gowun Batang",serif;cursor:pointer}
  button:hover{background:#E3D7EE}
  button:disabled{opacity:.65;cursor:wait}
  .msg{min-height:24px;margin:14px 0 0;text-align:center;color:#9A4E4E;font-size:.85rem;line-height:1.55}
  .tip{margin:20px 0 0;padding-top:18px;border-top:1px solid #E5EDE8;text-align:center;color:var(--soft);font-size:.78rem;line-height:1.65}
</style>
</head>
<body>
<main class="card">
  <p class="brand">Shueguk</p>
  <h1>교사 로그인</h1>
  <p class="intro">발급받은 아이디와 비밀번호를 입력하십시오.<br>선생님마다 자신의 계정으로 로그인해요.</p>
  <form id="loginForm" novalidate>
    <label>아이디
      <input id="loginId" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>비밀번호
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="submitBtn" type="submit">로그인</button>
    <p class="msg" id="message" role="alert" aria-live="polite"></p>
  </form>
  <p class="tip">아이디 또는 비밀번호를 잊었다면 관리자에게 문의하세요.<br>공용 기기에서는 사용 후 반드시 로그아웃하십시오.</p>
</main>
<script>
  (function(){
    var form = document.getElementById('loginForm');
    var id = document.getElementById('loginId');
    var password = document.getElementById('password');
    var button = document.getElementById('submitBtn');
    var message = document.getElementById('message');
    var params = new URLSearchParams(location.search);
    var next = TeacherAuth.safeNext(params.get('next'));

    form.addEventListener('submit', function(event){
      event.preventDefault();
      message.textContent = '';
      button.disabled = true;
      button.textContent = '확인 중…';
      TeacherAuth.login(id.value, password.value).then(function(){
        location.replace(next);
      }).catch(function(error){
        message.textContent = error && error.message ? error.message : '로그인하지 못했습니다. 다시 시도하십시오.';
        password.value = '';
        password.focus();
        button.disabled = false;
        button.textContent = '로그인';
      });
    });
  })();
</script>
</body>
</html>
