<script>
/* ══ 교사 페이지 조용한 인증 (2026-08-25, 3단계) ═══════════════════════
 * 이 아래 연결부들이 수파베이스에 보내는 요청에 '교사 신분'을 붙인다.
 * 화면에 로그인 창은 없다 — 페이지가 열릴 때 알아서 받아 온다.
 *
 * 왜 필요한가:
 *   공개 키(sb_publishable_…)는 학생이 여는 페이지에도 들어 있어서, 그 키로 표를
 *   직접 읽을 수 있으면 전교생 명단(학생ID=비밀번호·접근코드)이 새어 나간다.
 *   그래서 공개 키에서는 표 접근을 없애고(anon), 표는 이 신분(authenticated)만
 *   읽고 쓰도록 나눴다. 학생 화면은 표 대신 함수(student_bundle 등)를 쓴다.
 *
 * 주의:
 *   · 이 조각은 **교사용 페이지에만** 넣는다. 학생이 여는 페이지(s·r·클리닉 신청·
 *     모의고사 신청·H WORK 제출)에는 절대 넣지 말 것 — 넣는 순간 위 보호가 무의미해진다.
 *   · 아래 연결부들이 시작할 때 window.fetch 를 붙잡아 두므로, 이 조각은 **그것들보다
 *     먼저** 실행돼야 한다. 페이지의 첫 스크립트 자리를 지킬 것.
 *   · 인증이 실패하면 예전처럼 공개 키로 보낸다(권한을 회수하기 전까지는 그래도 동작). */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  var TOK_LS = 'sb_teacher_tok_v1';   // 받아 둔 신분증은 브라우저에 남겨 다음 페이지에서 다시 받지 않는다(1시간짜리)

  function cachedTok(){
    try {
      var c = JSON.parse(localStorage.getItem(TOK_LS) || 'null');
      if (c && c.t && c.u > Date.now()){ tok = c.t; until = c.u; return true; }
    } catch(e){}
    return false;
  }
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (cachedTok()) return Promise.resolve(tok);
    if (pending) return pending;
    var req = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token;
      until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;   // 만료 5분 전에 다시 받는다
      try { localStorage.setItem(TOK_LS, JSON.stringify({ t: tok, u: until })); } catch(e){}
      return tok;
    });
    /* 로그인이 멈춰 있으면 이 아래 모든 조회가 함께 멈춘다 — 10초를 넘기면 실패로 보고
     * 그 조회는 예전 방식(공개 키)으로 내보낸다. 다음 호출 때 다시 받는다. */
    var late = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('teacher auth timeout')); }, 10000); });
    pending = Promise.race([req, late]).then(function(t){ pending = null; return t; },
                                            function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY;
    h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h;
    return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0) return raw(url, opts);
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;                       // 만료가 겹쳤으면 한 번만 다시 받아 재시도
        try { localStorage.removeItem(TOK_LS); } catch(e){}
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>
<script>
/* ══ 수파베이스 미러 연결부 (주말 모의고사 출제 — 2026-08-23) ═══════════
 * 출제 저장·삭제는 기존 OMR 백엔드 그대로. 성공하면 수파베이스 미러
 * (omr_exams)를 함께 갱신한다. 실패해도 저장에는 영향 없음(일일 점검이 복구). */
(function(){
  if (window.__sbAdapter) return; window.__sbAdapter = true;
  var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var OMR_SIG = 'script.google.com/macros/s/AKfycbyUHMdCH';
  var rawFetch = window.fetch.bind(window);
  function sb(method, path, body){
    return rawFetch(SB + path, { method: method,
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json',
                 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: body == null ? undefined : JSON.stringify(body) })
      .then(function(r){ if (!r.ok) throw new Error('sb ' + r.status); });
  }
  var AFTER = {
    saveExam: function(b){
      sb('POST', '/omr_exams?on_conflict=name',
         [{ name: String(b.name || '').trim(), data: String(b.json || ''),
            mode: /"mode"\s*:\s*"통합"/.test(String(b.json || '')) ? '통합' : '' }])
        .catch(function(e){ console.warn('회차 미러 실패 — 일일 점검이 복구', e); });
    },
    deleteExam: function(b){
      sb('DELETE', '/omr_exams?name=eq.' + encodeURIComponent(String(b.name || '').trim()))
        .catch(function(e){ console.warn('회차 삭제 미러 실패 — 일일 점검이 복구', e); });
    }
  };
  window.fetch = function(url, opts){
    if (typeof url !== 'string' || url.indexOf(OMR_SIG) < 0 ||
        !opts || String(opts.method || '').toUpperCase() !== 'POST')
      return rawFetch(url, opts);
    var body = null;
    try { body = JSON.parse(opts.body); } catch (e) {}
    var after = body && AFTER[body.action];
    if (!after) return rawFetch(url, opts);
    return rawFetch(url, opts).then(function(r){
      return r.json().then(function(res){
        try { if (res && res.result === 'success') after(body); } catch (e) {}
        return { ok: true, status: 200, json: function(){ return Promise.resolve(res); },
                 text: function(){ return Promise.resolve(JSON.stringify(res)); } };
      }, function(){ return r; });
    });
  };
})();
</script>

<script>
/* ─────────── 데이터 모델 ─────────── */
// [고3형] 공통 1~34, 선택 35~45 (화작/언매 별도)
// [통합형] 1~45 전체 공통 (선택과목 없음 — 고1·고2식, 내년부터 전 학년)
const AREAS_COMMON = ["독서론","인문예술","사회문화","과학기술","고전시가","고전소설","현대시","현대소설","갈래복합"];
const AREAS_INT = ["화법","문법","인문예술","사회문화","과학기술","작문","현대시","현대소설","고전시가","고전소설","갈래복합"];
const AREAS_HWA = [];
const AREAS_EON = [];

// 상태: 각 문항 {ans, area, p3}
const data = {
  common: makeBlock(1,34),
  hwa: makeBlock(35,45),
  eon: makeBlock(35,45),
  int: makeBlock(1,45),
};
function makeBlock(from,to){
  const o={};
  for(let q=from;q<=to;q++) o[q]={ans:null, area:null, p3:false};
  return o;
}
// 통합형 기본 영역: 1~6번 화법, 7~10번 문법 (통상 배치 — 영역칸을 눌러 언제든 변경 가능)
for(let q=1;q<=6;q++) data.int[q].area='화법';
for(let q=7;q<=10;q++) data.int[q].area='문법';

let mode='g3';        // 'g3'=고3형(공통+선택), 'int'=통합형(1~45 공통)
let tab='common';
let brush=null;       // 선택된 영역(범위칠하기용)

function curBlock(){ return mode==='int' ? data.int : data[tab]; }
function curAreas(){ return mode==='int' ? AREAS_INT : (tab==='common'?AREAS_COMMON : tab==='hwa'?AREAS_HWA : AREAS_EON); }
function curRange(){ return mode==='int' ? [1,45] : (tab==='common'?[1,34]:[35,45]); }
function areaNeeded(){ return mode==='int' || tab==='common'; }   // 영역칸을 그릴지

/* ─────────── 렌더링 ─────────── */
function renderPalette(){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  pal.style.display = areaNeeded()?'flex':'none';
  curAreas().forEach(a=>{
    const b=document.createElement('button');
    b.textContent=a;
    if(a===brush) b.classList.add('on');
    b.onclick=()=>{ brush=(brush===a?null:a); renderPalette(); updateHint(); };
    pal.appendChild(b);
  });
}
function updateHint(){
  const h=document.getElementById('hint');
  if(!areaNeeded()){
    h.innerHTML='선택과목은 영역 지정이 필요 없습니다. <b>정답과 배점(2점/3점)</b>만 입력하세요.';
    return;
  }
  if(brush) h.innerHTML=`<b>「${brush}」</b> 영역 선택됨 — 해당하는 문항의 영역칸을 누르면 일괄 지정됩니다. 다시 누르면 해제.`;
  else h.textContent='먼저 위에서 영역을 고른 뒤, 문항의 영역칸을 눌러 지정하세요. 배점은 [2점] 뱃지를 눌러 [3점]으로 토글합니다.';
}
function render(){
  const [from,to]=curRange();
  const blk=curBlock();
  const grid=document.getElementById('qgrid');
  grid.innerHTML='';
  for(let q=from;q<=to;q++){
    const d=blk[q];
    const card=document.createElement('div');
    card.className='qcard';
    // 정답 버튼
    let choices='<div class="choices">';
    for(let j=1;j<=5;j++) choices+=`<button class="${d.ans===j?'sel':''}" onclick="setAns(${q},${j})">${j}</button>`;
    choices+='</div>';
    const isCommon = areaNeeded();
    card.innerHTML=`
      <div class="qhead">
        <span class="qno">${q}번</span>
        <span class="pt ${d.p3?'p3':''}" onclick="togglePt(${q})">${d.p3?'3점':'2점'}</span>
      </div>
      ${choices}
      ${isCommon ? `<div class="qarea ${d.area?'':'empty'}" onclick="paintArea(${q})">${d.area||'영역 미지정'}</div>` : ''}`;
    grid.appendChild(card);
  }
  // 헤더 정보
  document.getElementById('secTitle').textContent =
    mode==='int' ? '통합형 공통 (1–45번)' :
    tab==='common'?'공통 과목 (1–34번)':tab==='hwa'?'화법과작문 (35–45번)':'언어와매체 (35–45번)';
  updateMini();
}
function updateMini(){
  const [from,to]=curRange(); const blk=curBlock();
  let ans=0, area=0, p3=0, sum=0;
  for(let q=from;q<=to;q++){ const d=blk[q];
    if(d.ans) ans++; if(d.area) area++; if(d.p3) p3++;
    sum += d.p3?3:2;
  }
  const n=to-from+1;
  const areaPart = areaNeeded() ? ` · 영역 ${area}/${n}` : '';
  document.getElementById('secMini').textContent =
    `정답 ${ans}/${n}${areaPart} · 3점 ${p3}개 · 배점합 ${sum}`;
}

/* ─────────── 조작 ─────────── */
function setAns(q,j){ curBlock()[q].ans=j; render(); }
function togglePt(q){ curBlock()[q].p3=!curBlock()[q].p3; render(); }
function paintArea(q){
  if(!brush){ toast('먼저 위에서 영역을 선택하세요'); return; }
  const d=curBlock()[q];
  d.area=(d.area===brush?null:brush);
  render();
}
function switchTab(t){
  tab=t; brush=null;
  ['common','hwa','eon'].forEach(x=>
    document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===t));
  renderPalette(); updateHint(); render();
}
function switchMode(m){
  mode=m; brush=null;
  document.getElementById('fmtInt').classList.toggle('on', m==='int');
  document.getElementById('fmtG3').classList.toggle('on', m==='g3');
  document.getElementById('subjTabs').style.display = m==='int' ? 'none' : 'flex';
  document.getElementById('cutsG3').style.display = m==='int' ? 'none' : 'flex';
  document.getElementById('cutsInt').style.display = m==='int' ? 'flex' : 'none';
  document.getElementById('out').style.display='none';   // 형식이 바뀌면 이전 생성 결과는 무효
  renderPalette(); updateHint(); render();
}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }

/* ─────────── 데이터 생성 ─────────── */
function buildExam(subjectKey){
  // 공통 + 해당 선택과목 합치기
  const subjBlock = subjectKey==='hwa'?data.hwa:data.eon;
  const subjectName = subjectKey==='hwa'?'화법과작문':'언어와 매체';
  const answers={}, points={}, areaMap={};
  function add(q,d,forceArea){
    answers[q]=d.ans; points[q]=d.p3?3:2;
    const area=forceArea || d.area || '미지정';
    if(!areaMap[area]) areaMap[area]={name:area, qs:[]};
    areaMap[area].qs.push(q);
  }
  for(let q=1;q<=34;q++) add(q, data.common[q]);
  for(let q=35;q<=45;q++) add(q, subjBlock[q], subjectName);  // 선택과목 영역 자동

  // 큰분류 매핑
  const CAT={ "독서론":"독서","인문예술":"독서","사회문화":"독서","과학기술":"독서",
    "고전소설":"문학","현대시":"문학","현대소설":"문학","고전시가":"문학","갈래복합":"문학",
    "화법과작문":"선택과목","언어와 매체":"선택과목","언어와매체":"선택과목" };
  const cuts = subjectKey==='hwa'
    ? [val('cutHwa1'),val('cutHwa2'),val('cutHwa3'),val('cutHwa4')]
    : [val('cutEon1'),val('cutEon2'),val('cutEon3'),val('cutEon4')];

  const areas = Object.values(areaMap).map(a=>({
    cat: CAT[a.name]||'기타', name:a.name, qs:a.qs
  }));
  return {
    code: val('code'), date: val('date'), grade: val('grade'),
    subject: subjectName, cuts: cuts.map(Number),
    answers, points, areas
  };
}
function val(id){ return document.getElementById(id).value.trim(); }

/* 통합형(1~45 공통) 데이터 — 선택과목 없음, 등급컷 1세트(시험마다 입력) */
function buildExamInt(){
  const answers={}, points={}, areaMap={};
  for(let q=1;q<=45;q++){
    const d=data.int[q];
    answers[q]=d.ans; points[q]=d.p3?3:2;
    const area=d.area||'미지정';
    if(!areaMap[area]) areaMap[area]={name:area, qs:[]};
    areaMap[area].qs.push(q);
  }
  // 성적표 큰분류 (영역별 성취도 표의 왼쪽 묶음)
  const CAT={ "화법":"화작","작문":"화작","문법":"문법",
    "인문예술":"독서","사회문화":"독서","과학기술":"독서",
    "고전소설":"문학","현대시":"문학","현대소설":"문학","고전시가":"문학","갈래복합":"문학" };
  const areas = Object.values(areaMap).map(a=>({ cat: CAT[a.name]||'기타', name:a.name, qs:a.qs }));
  return {
    code: val('code'), date: val('date'), grade: val('grade'),
    subject: '공통',
    cuts: [val('cutInt1'),val('cutInt2'),val('cutInt3'),val('cutInt4')].map(Number),
    answers, points, areas
  };
}

function validate(){
  const problems=[];
  if(mode==='int'){
    for(let q=1;q<=45;q++){ const d=data.int[q];
      if(!d.ans) problems.push(`${q}번 정답 미입력`);
      if(!d.area) problems.push(`${q}번 영역 미지정`);
    }
    return problems;
  }
  // 공통 정답/영역
  for(let q=1;q<=34;q++){ const d=data.common[q];
    if(!d.ans) problems.push(`공통 ${q}번 정답 미입력`);
    if(!d.area) problems.push(`공통 ${q}번 영역 미지정`);
  }
  ['hwa','eon'].forEach(k=>{ const nm=k==='hwa'?'화작':'언매';
    for(let q=35;q<=45;q++){ const d=data[k][q];
      if(!d.ans) problems.push(`${nm} ${q}번 정답 미입력`);
    }
  });
  return problems;
}

function generate(){
  const probs=validate();
  if(probs.length){
    toast(`미입력 ${probs.length}건 — ${probs[0]}${probs.length>1?' 외':''}`);
    // 그래도 부분 출력은 허용하되 경고
  }
  const out=document.getElementById('out');
  if(mode==='int'){
    // 통합형: mode 표시 + '통합' 키 하나 (채점 백엔드가 이 키를 보면 선택과목 없이 채점)
    const exam = { mode:'통합', 통합: buildExamInt() };
    out.style.display='block';
    document.getElementById('outText').value = JSON.stringify(exam, null, 2);
    const s=sumPtsInt();
    document.getElementById('summary').innerHTML =
      `배점 합계 <b>${s}점</b>` +
      (probs.length?` · <span style="color:var(--warn)">미입력 ${probs.length}건 확인 필요</span>`:` · <span style="color:var(--ok)">입력 완료</span>`);
    out.scrollIntoView({behavior:'smooth'});
    return;
  }
  const exam = { 화법과작문: buildExam('hwa'), 언어와매체: buildExam('eon') };
  out.style.display='block';
  document.getElementById('outText').value = JSON.stringify(exam, null, 2);

  // 요약
  const sH=sumPts('hwa'), sE=sumPts('eon');
  document.getElementById('summary').innerHTML =
    `배점 합계 — 화작 <b>${sH}점</b>, 언매 <b>${sE}점</b>` +
    (probs.length?` · <span style="color:var(--warn)">미입력 ${probs.length}건 확인 필요</span>`:` · <span style="color:var(--ok)">입력 완료</span>`);
  out.scrollIntoView({behavior:'smooth'});
}
function sumPts(k){ let s=0; for(let q=1;q<=34;q++)s+=data.common[q].p3?3:2;
  for(let q=35;q<=45;q++)s+=data[k][q].p3?3:2; return s; }
function sumPtsInt(){ let s=0; for(let q=1;q<=45;q++)s+=data.int[q].p3?3:2; return s; }

/* '시트에 바로 저장' — OMR 백엔드 '회차정답' 탭에 기록 (같은 회차 이름이면 덮어쓰기).
 * 저장되면 학생용 OMR 회차 목록에 바로 나타난다. */
var OMR_API = "https://script.google.com/macros/s/AKfycbyUHMdCH_u35Oeu6lEmx3yOYscoKLwEB8TC0QHGBOaCXZ4rbAnkMpP9_Na4l3QLOajGPA/exec";
function saveToSheet(){
  const name = val('code');
  if(!name){ toast('시험지 이름/회차 코드를 먼저 입력하세요'); document.getElementById('code').focus(); return; }
  generate();   // 최신 입력으로 데이터 생성(검증 포함)
  const jsonStr = document.getElementById('outText').value;
  if(!jsonStr){ toast('데이터 생성에 실패했어요'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; const label = btn.textContent; btn.textContent = '저장 중…';
  fetch(OMR_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // CORS 프리플라이트 회피
    body: JSON.stringify({ action: 'saveExam', pw: 'sh', name: name, json: jsonStr })
  })
  .then(r => r.json())
  .then(res => {
    btn.disabled = false; btn.textContent = label;
    if(res && res.result === 'success'){
      toast(res.updated ? `'${name}' 회차를 수정 저장했습니다 — 학생 OMR에 반영됨`
                        : `'${name}' 회차를 저장했습니다 — 학생 OMR에 바로 나타납니다`);
    } else {
      toast('저장 실패: ' + ((res && res.message) || '알 수 없는 오류'));
    }
  })
  .catch(() => { btn.disabled = false; btn.textContent = label; toast('저장 실패 — 인터넷 연결을 확인하세요'); });
}

function copyOut(){
  const t=document.getElementById('outText');
  if(!t.value){ toast('먼저 데이터를 생성하세요'); return; }
  navigator.clipboard.writeText(t.value).then(()=>toast('클립보드에 복사되었습니다'));
}

/* init */
renderPalette(); updateHint(); render();
</script>
