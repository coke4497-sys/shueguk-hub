  body{background:#c3d2cc;color:var(--ink-body);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;}

  /* ── 고정 1520×856 캔버스 + 레터박스 ── */

</script>

  <h1>어느 선생님 화면인가요?</h1>
  <select id="psel"></select>
  <button onclick="go()">이 화면으로 열기</button>
  <p>전자칠판·TV에 전체 화면으로 띄워 두면 호출된 학생 이름이 크게 나와요.</p>
</div></div>

<div id="stage"><div id="frame">
  <div class="top">
    <div class="l">
      <span class="logo">Shueguk</span><span class="bar"></span>
      <span class="name">클리닉 호출</span><span class="who" id="who"></span>
    </div>
    <div class="r">
      <span class="live" id="live"><i></i><span id="liveTx">실시간</span></span>
      <span class="clock" id="clock"></span>
      <a class="fs" id="lnkOrder" href="question.html">순서 정하기</a>
      <a class="fs" href="clinic.html">클리닉 메뉴</a>
      <button class="fs" type="button" onclick="fullscreen()">전체 화면</button>
    </div>
  </div>
  <div class="col" id="main">
    <div class="card call" id="callCard">
      <div class="hd">
        <div class="hl"><span class="dot"><span></span><span class="rip"></span></span><h2>지금 선생님께 오세요</h2></div>
        <span class="since" id="since" hidden></span>
      </div>
      <div class="now" id="now"><div class="none">지금 호출된 친구가 없어요</div></div>
      <div class="prog"><div class="lbl">호출 시간 경과</div><div class="track"><div class="fill" id="progFill"></div></div></div>
    </div>
    <div class="card nextc">
      <div class="hd"><h2>다음 순서</h2><span class="sub" id="nextSub"></span></div>
      <div class="next" id="next"><div class="none">대기 중인 친구가 없어요</div></div>
    </div>
  </div>
  <div class="col side">
    <div class="card resvc">
      <div class="hd"><h2>아직 줄 안 선 친구</h2><span class="badge" id="resvN">0</span></div>
      <p class="desc">준비가 되면 <b>질문 대기</b>를 눌러 줄에 서세요</p>
      <ul id="sideList"><li class="none">모두 줄을 섰어요</li></ul>
    </div>
    <div class="card stats">
      <div><span class="v" id="stCall">0</span><span class="k">호출 중</span></div><i></i>
      <div><span class="v" id="stWait">0</span><span class="k">대기</span></div><i></i>
      <div><span class="v" id="stResv">0</span><span class="k">줄 안 섬</span></div><i></i>
      <div><span class="v" id="stAvg">–</span><span class="k">평균 상담</span></div>
    </div>
  </div>
</div></div>
<div class="arrive" id="arrive"><div class="box"><span id="arriveList"></span></div></div>
<div id="cf"><div class="box"><p class="q" id="cfQ"></p><p class="sub">맞으면 지금 시각으로 줄에 서요. 먼저 누른 순서대로 호출돼요.</p><div class="btns"><button type="button" class="no" onclick="cfNo()">아니요</button><button type="button" class="yes" id="cfYes" onclick="cfYes()">네, 도착했어요</button></div></div></div>
<div class="foot"><span id="cnt"></span><span id="upd"></span><span id="err"></span></div>

<script>
var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
var T = new URLSearchParams(location.search).get('t') || '';
var LAST_CALL = '';          // 호출 중인 줄 id 목록 — 바뀔 때만 이름을 다시 그린다(등장 애니메이션 한 번)
var LAST_AT = {};            // 줄 id → 마지막으로 본 called_at. 같은 학생인데 이 값이 새로워지면 = 선생님이 [다시 호출]
var KIOSK_W = 1520, KIOSK_H = 856;
var BREATHE_MS = 15000;      // 호출 뒤 이만큼 조용히 있다가 숨쉬기 시작
var WINDOW_MS = 60000;       // '호출 시간 경과' 막대가 다 차는 시간(1분) — 자동 넘김은 없고 막대만 찬다
var NEXT_MAX = 4;            // 다음 순서 칸 수 — 고정 폭에서 이름을 줄이지 않고 보여 줄 수 있는 수
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function kstToday(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
function hm(d){ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); }
function sb(path, opts){
  var o = opts || {}; o.headers = o.headers || {};
  if(o.body && !o.headers['Content-Type']) o.headers['Content-Type'] = 'application/json';
  return fetch(SB + path, o).then(function(r){ if(!r.ok) throw new Error('수파베이스 ' + r.status); return r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
/* 시계 — 초 경계에 맞춰 다시 읽어 :00 에 정확히 넘어가게 */
function tick(){ $('clock').textContent = hm(new Date()); setTimeout(tick, 1000 - (Date.now() % 1000)); }
tick();
function fullscreen(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); return; }
  var el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
}
/* 캔버스 맞추기 — 1520×856 를 화면에 들어가는 만큼 통째로 줄이거나 키운다(리플로우 없음) */
function fit(){
  var s = Math.min(window.innerWidth / KIOSK_W, window.innerHeight / KIOSK_H);
  $('frame').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
function setLive(on){ var el = $('live'); el.classList.toggle('off', !on); $('liveTx').textContent = on ? '실시간' : '연결 끊김'; }

function showPick(){
  $('pick').style.display = 'flex';
  sb('/rpc/qq_teachers', { method:'POST', body:'{}' }).then(function(list){
    var sel = $('psel');
    sel.innerHTML = (list||[]).map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+' 선생님</option>'; }).join('')
                  + '<option value="all">모든 선생님 (한 화면에)</option>';
    try{ var s = localStorage.getItem('qq_teacher'); if(s) sel.value = s; }catch(e){}
  }).catch(function(){ $('err').textContent = '선생님 목록을 불러오지 못했어요'; });
}
function go(){ var v = $('psel').value; if(!v) return; location.search = '?t=' + encodeURIComponent(v); }

function load(){
  var q = '/question_queue?select=id,ord,name,school,grade,teacher,status,unit,called_at,done_at&qdate=eq.' + kstToday()
        + '&status=in.(예약,명단,대기,호출,질문중,완료)&order=ord.asc,id.asc' + (T==='all' ? '' : '&teacher=eq.' + encodeURIComponent(T));
  return sb(q).then(function(rows){
    rows = rows || [];
    var call = rows.filter(function(r){ return r.status==='호출'; }).sort(function(a,b){ return String(a.called_at).localeCompare(String(b.called_at)); });
    var asking = rows.filter(function(r){ return r.status==='질문중'; });   // 와서 질문하는 중 — '오세요'는 내리고 작게만 표시
    var wait = rows.filter(function(r){ return r.status==='대기'; });
    var resv = rows.filter(function(r){ return r.status==='예약' || r.status==='명단'; }).sort(function(a,b){ return String(a.unit).localeCompare(String(b.unit)) || String(a.name).localeCompare(String(b.name)); });
    var done = rows.filter(function(r){ return r.status==='완료' && r.called_at && r.done_at; });
    var avg = avgMinutes(done);   // 오늘 질문 하나에 걸린 평균(분) — 표본 2건 미만이면 기본 5분
    // 예상 대기: 호출 중인 친구가 있으면 그 친구가 끝날 때까지 + 앞 사람 수 × 평균
    var etaOf = function(i){ var m = Math.round(avg * (i + ((call.length || asking.length) ? 1 : 0))); return m <= 0 ? '곧 차례' : '약 ' + m + '분'; };
    var tag = function(r){ return T==='all' ? '<small>'+esc(r.teacher)+' 선생님께</small>' : ''; };
    var key = call.map(function(r){ return r.id; }).join(',');
    // 오늘 몇 번째 호출인지 — 오늘 호출된 적 있는 줄(호출·완료 등 called_at 있음)을 호출 시각순으로 세어 자리를 찾는다
    var calledAll = rows.filter(function(r){ return r.called_at; }).sort(function(a,b){ return String(a.called_at).localeCompare(String(b.called_at)); });
    var nth = function(r){ var i = calledAll.map(function(x){ return x.id; }).indexOf(r.id); return i < 0 ? '' : '오늘 ' + (i+1) + '번째 호출'; };
    // 재호출 판정 — 호출 명단은 그대로인데 어느 줄의 called_at 이 전에 본 것보다 새롭다 = 선생님이 [다시 호출]
    var recalled = key && key === LAST_CALL && call.some(function(r){ return LAST_AT[r.id] && r.called_at && Date.parse(r.called_at) > Date.parse(LAST_AT[r.id]); });
    LAST_AT = {}; call.forEach(function(r){ LAST_AT[r.id] = r.called_at; });
    if(key !== LAST_CALL){   // 호출 명단이 바뀌었을 때만 다시 그려 애니메이션이 한 번만 돈다
      LAST_CALL = key;
      $('now').innerHTML = call.length
        ? '<div class="lead">선생님께 오세요</div><div class="wrap" id="nowWrap">' + call.map(function(r){ return '<div class="nm'+(call.length>1?' many':'')+'">'+esc(r.name)+tag(r)+'</div>'; }).join('') + '</div>'
          + '<div class="meta">' + esc([call.length===1 && call[0].unit ? call[0].unit : '', call.length===1 ? nth(call[0]) : call.length + '명 호출 중'].filter(Boolean).join(' · ')) + '</div>'
        : '<div class="none">지금 호출된 친구가 없어요</div><div class="up" id="nowUp"></div>';
    } else if(recalled){ burst(); }
    if(!call.length){ var upEl = $('nowUp'); if(upEl) upEl.innerHTML = (asking.length ? '<div>질문 중 <b>'+asking.map(function(r){ return esc(r.name); }).join(' · ')+'</b></div>' : '') + (wait.length ? '<div>다음 차례 <b>'+esc(wait[0].name)+'</b></div>' : ''); }
    CALL_AT = call.length ? Math.min.apply(null, call.map(function(r){ return new Date(r.called_at).getTime() || Date.now(); })) : 0;
    AVG_MS = avg * 60000; sinceTick();
    $('nextSub').textContent = wait.length ? wait.length + '명 대기' + (wait.length > 1 ? ' · 마지막 ' + etaOf(wait.length-1) : '') : '';
    $('next').innerHTML = wait.length
      ? '<ol>' + wait.slice(0, NEXT_MAX).map(function(r, i){ return '<li><span class="row"><span class="i">'+(i===0?'NEXT':(i<9?'0'+(i+1):(i+1)))+'</span><span class="eta">'+etaOf(i)+'</span></span><span class="n">'+esc(r.name)+'</span>'+(T==='all'?'<span class="t">'+esc(r.teacher)+'T</span>':'')+'</li>'; }).join('') + '</ol>'
      : '<div class="none">대기 중인 친구가 없어요</div>';
    // 아직 줄 안 선 친구(클리닉 신청·반 명단) — 이름 옆 [질문 대기]로 줄에 선다
    RESV = resv;
    $('arriveList').innerHTML = '';
    $('sideList').innerHTML = resv.length ? resv.map(function(r){
        var sub = [r.status==='명단' ? (r.unit||'') : '클리닉 신청', T==='all' ? esc(r.teacher)+'T' : ''].filter(Boolean).join(' · ');
        return '<li class="'+(r.status==='예약' ? 'clinic' : '')+'"><span class="nmx"><span class="n">'+esc(r.name)+'</span>'+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</span><button type="button" onclick="cfOpen('+r.id+')">질문 대기</button></li>'; }).join('')
      : '<li class="none">모두 줄을 섰어요</li>';
    $('resvN').textContent = resv.length;
    $('stCall').textContent = call.length; $('stWait').textContent = wait.length; $('stResv').textContent = resv.length;
    $('stAvg').textContent = done.length >= 2 ? Math.round(avg) + '분' : '–';
    $('cnt').textContent = '대기 ' + wait.length + '명' + (call.length ? ' · 호출 ' + call.length + '명' : '') + (resv.length ? ' · 줄 안 선 친구 ' + resv.length + '명' : '') + (done.length >= 2 ? ' · 질문당 약 ' + Math.round(avg) + '분' : '');
    $('upd').textContent = hm(new Date()) + ' 확인';
    $('err').textContent = ''; setLive(true);
  }).catch(function(e){ $('err').textContent = '연결이 잘 안 돼요 — 잠시 후 다시 받아요'; setLive(false); });
}

var RESV = [], CF_ID = null, CALL_AT = 0, AVG_MS = 5*60000;
/* 호출 뒤 흐른 시간 — 알약 '호출 후 m:ss' + 아래 막대(1분에 다 참) + 15초 지나면 숨쉬기 */
function sinceTick(){
  var el = $('since'), fill = $('progFill'), card = $('callCard'); if(!el || !fill) return;
  var prog = fill.parentNode.parentNode;
  if(!CALL_AT){ el.hidden = true; fill.style.width = '0'; prog.classList.add('off'); card.classList.remove('breathing'); return; }
  prog.classList.remove('off');
  var ms = Math.max(0, Date.now() - CALL_AT), m = Math.floor(ms/60000), sec = Math.floor(ms/1000) % 60;
  el.hidden = false; el.textContent = '호출 후 ' + m + ':' + (sec < 10 ? '0' : '') + sec;
  fill.style.width = Math.min(100, ms / WINDOW_MS * 100).toFixed(1) + '%';
  card.classList.toggle('breathing', ms >= BREATHE_MS);
}
setInterval(sinceTick, 1000);
function avgMinutes(done){
  var mins = done.map(function(r){ return (new Date(r.done_at) - new Date(r.called_at)) / 60000; })
                 .filter(function(m){ return m > 0.3 && m < 60; });      // 0.3분 미만(잘못 누름)·60분 초과(잊고 둔 것)는 뺀다
  if(mins.length < 2) return 5;
  mins.sort(function(a,b){ return a-b; });
  var mid = mins.slice(Math.floor(mins.length*0.1), Math.ceil(mins.length*0.9));   // 양끝 10% 제외
  return Math.max(1, mid.reduce(function(a,b){ return a+b; }, 0) / mid.length);
}
/* 재호출 하트 — 이름에서 하트 14개가 팡 터져 흩어진다(브랜드 파스텔 5색, 1.0~1.3초). 이름은 살짝 커졌다 돌아온다. */
var HEART_TINTS = ['#e79aa4','#c98b72','#b3a9d6','#e2c48f','#dba3ae'], HEART_N = 14, HEART_MS = 1500;
var HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21c-.3 0-.6-.1-.8-.3C6.3 16.4 3 13.4 3 9.6 3 6.6 5.3 4.3 8.2 4.3c1.6 0 3 .7 3.8 1.9.8-1.2 2.2-1.9 3.8-1.9C18.7 4.3 21 6.6 21 9.6c0 3.8-3.3 6.8-8.2 11.1-.2.2-.5.3-.8.3Z"/></svg>';
function burst(){
  var wrap = $('nowWrap'); if(!wrap) return;
  var old = wrap.querySelector('.hb'); if(old) old.remove();   // 연달아 누르면 처음부터 다시
  var layer = document.createElement('div'); layer.className = 'hb'; layer.setAttribute('aria-hidden', 'true');
  var html = '';
  for(var i = 0; i < HEART_N; i++){
    var angle = (i / HEART_N) * Math.PI * 2 + (Math.random() - .5) * .5, dist = 165 + Math.random() * 135;   // 이름 둘레로 퍼지되 위로 치우치게
    html += '<span class="heart" style="--ox:'+((Math.random()-.5)*190).toFixed(0)+'px;--oy:'+((Math.random()-.5)*54).toFixed(0)+'px;--dx:'+(Math.cos(angle)*dist).toFixed(0)+'px;--dy:'+(Math.sin(angle)*dist*.66-58).toFixed(0)+'px;--size:'+(20+Math.random()*20).toFixed(0)+'px;--rot:'+((Math.random()-.5)*90).toFixed(0)+'deg;--delay:'+(Math.random()*260).toFixed(0)+'ms;--dur:'+(1000+Math.random()*320).toFixed(0)+'ms;--tint:'+HEART_TINTS[i % HEART_TINTS.length]+'">'+HEART_SVG+'</span>';
  }
  layer.innerHTML = html; wrap.appendChild(layer);
  setTimeout(function(){ if(layer.parentNode) layer.remove(); }, HEART_MS);
  Array.prototype.forEach.call(wrap.querySelectorAll('.nm'), function(nm){ nm.classList.remove('pop'); void nm.offsetWidth; nm.classList.add('pop'); });
}
function cfOpen(id){
  var r = RESV.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  CF_ID = id;
  $('cfQ').innerHTML = '<b>' + esc(r.name) + '</b> 맞나요?';
  $('cfYes').disabled = false; $('cfYes').textContent = r.status==='명단' ? '네, 질문할게요' : '네, 도착했어요';
  $('cf').style.display = 'flex';
}
function cfNo(){ $('cf').style.display = 'none'; CF_ID = null; }
function cfYes(){
  var id = CF_ID; if(!id) return;
  $('cfYes').disabled = true; $('cfYes').textContent = '줄 서는 중…';
  var qt = new Date(Date.now() + 9*3600*1000).toISOString().slice(11,16);
  sb('/question_queue?id=eq.' + id + '&status=in.(예약,명단)', { method:'PATCH', headers:{ 'Prefer':'return=minimal' }, body: JSON.stringify({ status:'대기', ord: Date.now(), qtime: qt }) })
    .then(function(){ cfNo(); return load(); })
    .catch(function(){ $('cfYes').disabled = false; $('cfYes').textContent = '다시 눌러 주세요'; });
}

if(!T){ showPick(); }
else {
  $('stage').style.display = 'flex'; fit();
  $('who').textContent = T==='all' ? '모든 선생님' : T + ' 선생님';
  $('lnkOrder').href = 'question.html?t=' + encodeURIComponent(T);
  document.title = (T==='all' ? '전체' : T) + ' · 클리닉 호출';
  load(); setInterval(load, 3000);
}
</script>
</body>
