(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (pending) return pending;
    pending = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      pending = null;
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token; until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;
      return tok;
    }, function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY; h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h; return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0) return raw(url, opts);
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();

<script>
var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
var T = new URLSearchParams(location.search).get('t') || '';
var LAST_CALL = '';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function kstToday(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
function hm(d){ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); }
function sb(path, opts){
  var o = opts || {}; o.headers = o.headers || {};
  if(o.body && !o.headers['Content-Type']) o.headers['Content-Type'] = 'application/json';
  return fetch(SB + path, o).then(function(r){ if(!r.ok) throw new Error('수파베이스 ' + r.status); return r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
function tick(){ $('clock').textContent = hm(new Date()); }
setInterval(tick, 1000); tick();
function fullscreen(){ var el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }

function showPick(){
  $('pick').style.display = 'flex';
  sb('/rpc/qq_teachers', { method:'POST', body:'{}' }).then(function(list){
    var sel = $('psel');
    sel.innerHTML = (list||[]).map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+' 선생님</option>'; }).join('')
                  + '<option value="all">모든 선생님 (한 화면에)</option>';
    try{ var s = localStorage.getItem('qq_teacher'); if(s) sel.value = s; }catch(e){}
  }).catch(function(){ $('err').textContent = '선생님 목록을 불러오지 못했어요'; });
}
function go(){ var v = $('psel').value; if(!v) return; location.search = '?t=' + encodeURIComponent(v); }

function load(){
  var q = '/question_queue?select=id,ord,name,school,grade,teacher,status,unit,called_at,done_at&qdate=eq.' + kstToday()
        + '&status=in.(예약,명단,대기,호출,완료)&order=ord.asc,id.asc' + (T==='all' ? '' : '&teacher=eq.' + encodeURIComponent(T));
  return sb(q).then(function(rows){
    rows = rows || [];
    var call = rows.filter(function(r){ return r.status==='호출'; }).sort(function(a,b){ return String(a.called_at).localeCompare(String(b.called_at)); });
    var wait = rows.filter(function(r){ return r.status==='대기'; });
    var resv = rows.filter(function(r){ return r.status==='예약' || r.status==='명단'; }).sort(function(a,b){ return String(a.unit).localeCompare(String(b.unit)) || String(a.name).localeCompare(String(b.name)); });
    var done = rows.filter(function(r){ return r.status==='완료' && r.called_at && r.done_at; });
    var avg = avgMinutes(done);   // 오늘 질문 하나에 걸린 평균(분) — 표본 2건 미만이면 기본 5분
    // 예상 대기: 호출 중인 친구가 있으면 그 친구가 끝날 때까지 + 앞 사람 수 × 평균
    var etaOf = function(i){ var m = Math.round(avg * (i + (call.length ? 1 : 0))); return m <= 0 ? '곧 차례' : '약 ' + m + '분'; };
    var tag = function(r){ return T==='all' ? '<small>'+esc(r.teacher)+' 선생님께</small>' : ''; };
    var key = call.map(function(r){ return r.id; }).join(',');
    if(key !== LAST_CALL){   // 호출 명단이 바뀌었을 때만 다시 그려 애니메이션이 한 번만 돈다
      LAST_CALL = key;
      $('now').innerHTML = call.length
        ? '<div class="lead">선생님께 오세요</div>' + call.map(function(r){ return '<div class="nm'+(call.length>2?' many':'')+'">'+esc(r.name)+tag(r)+'</div>'; }).join('')
        : '<div class="none">호출된 학생이 없어요</div><div class="up" id="nowUp"></div>';
    }
    if(!call.length){ var upEl = $('nowUp'); if(upEl) upEl.innerHTML = wait.length ? '다음 차례 <b>'+esc(wait[0].name)+'</b>' : ''; }
    var MAX = 8;
    $('next').innerHTML = wait.length
      ? '<ol>' + wait.slice(0, MAX).map(function(r, i){ return '<li><span class="i">'+(i+1)+'</span><span>'+esc(r.name)+'</span>'+(T==='all'?'<span class="t">'+esc(r.teacher)+'T</span>':'')+'<span class="eta">'+etaOf(i)+'</span></li>'; }).join('')
        + (wait.length > MAX ? '<li class="more">… 외 '+(wait.length-MAX)+'명</li>' : '') + '</ol>'
      : '<div class="none">기다리는 학생이 없어요</div>';
    // 아직 안 온 친구(클리닉 신청) — 이름을 눌러 도착 체크
    RESV = resv;
    $('arrive').style.display = resv.length ? 'block' : 'none';
    var unitKeys = []; resv.forEach(function(r){ if(r.status==='명단' && unitKeys.indexOf(r.unit||'')<0) unitKeys.push(r.unit||''); });
    $('arriveList').innerHTML = '';
    $('sideList').innerHTML = resv.length ? resv.map(function(r){ var cls = r.status==='예약' ? 'clinic' : 'c' + (unitKeys.indexOf(r.unit||'') % 4);
        return '<li class="'+cls+'"><span class="nmx">'+esc(r.name)+' '+(r.status==='명단' && r.unit ? '<small>'+esc(r.unit)+'</small>' : (r.status==='예약' ? '<small>클리닉</small>' : ''))+(T==='all'?' <small>'+esc(r.teacher)+'T</small>':'')+'</span><button type="button" onclick="cfOpen('+r.id+')">줄서기</button></li>'; }).join('')
      : '<li class="none" style="background:none;padding:0">아직 줄에 서지 않은 친구가 없어요</li>';
    $('cnt').textContent = '대기 ' + wait.length + '명' + (call.length ? ' · 호출 ' + call.length + '명' : '') + (resv.length ? ' · 줄 안 선 친구 ' + resv.length + '명' : '') + (done.length >= 2 ? ' · 질문당 약 ' + Math.round(avg) + '분' : '');
    $('upd').textContent = hm(new Date()) + ' 확인';
    $('err').textContent = '';
  }).catch(function(e){ $('err').textContent = '연결이 잘 안 돼요 — 잠시 후 다시 받아요'; });
}

var RESV = [], CF_ID = null;
function avgMinutes(done){
  var mins = done.map(function(r){ return (new Date(r.done_at) - new Date(r.called_at)) / 60000; })
                 .filter(function(m){ return m > 0.3 && m < 60; });      // 0.3분 미만(잘못 누름)·60분 초과(잊고 둔 것)는 뺀다
  if(mins.length < 2) return 5;
  mins.sort(function(a,b){ return a-b; });
  var mid = mins.slice(Math.floor(mins.length*0.1), Math.ceil(mins.length*0.9));   // 양끝 10% 제외
  return Math.max(1, mid.reduce(function(a,b){ return a+b; }, 0) / mid.length);
}
function cfOpen(id){
  var r = RESV.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  CF_ID = id;
  $('cfQ').innerHTML = '<b>' + esc(r.name) + '</b> 맞나요?';
  $('cfYes').disabled = false; $('cfYes').textContent = r.status==='명단' ? '네, 질문할게요' : '네, 도착했어요';
  $('cf').style.display = 'flex';
}
function cfNo(){ $('cf').style.display = 'none'; CF_ID = null; }
function cfYes(){
  var id = CF_ID; if(!id) return;
  $('cfYes').disabled = true; $('cfYes').textContent = '줄 서는 중…';
  var qt = new Date(Date.now() + 9*3600*1000).toISOString().slice(11,16);
  sb('/question_queue?id=eq.' + id + '&status=in.(예약,명단)', { method:'PATCH', headers:{ 'Prefer':'return=minimal' }, body: JSON.stringify({ status:'대기', ord: Date.now(), qtime: qt }) })
    .then(function(){ cfNo(); return load(); })
    .catch(function(){ $('cfYes').disabled = false; $('cfYes').textContent = '다시 눌러 주세요'; });
}

if(!T){ showPick(); }
else {
  $('main').style.display = 'grid';
  $('who').textContent = T==='all' ? '클리닉 호출 · 모든 선생님' : '클리닉 호출 · ' + T + ' 선생님';
  document.title = (T==='all' ? '전체' : T) + ' · 클리닉 호출';
  load(); setInterval(load, 3000);
}
</script>
</body>
