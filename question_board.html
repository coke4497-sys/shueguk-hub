<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이수경국어 · 클리닉 호출 · 전자칠판 대기 화면</title>
<!-- 이수경국어 질문 대기열 — 강의실 디스플레이 (2026-09-06)
     TV·모니터에 띄워 두는 화면. 선생님이 question.html 에서 [호출]한 학생 이름을 크게 보여 주고,
     아래에 다음 순서를 적는다. 3초마다 새로 받는다. 주소에 ?t=선생님 (또는 t=all 전체).
     교사 신분(조용한 인증)으로 question_queue 를 읽는다 — 강의실 기기에서만 열 것. -->
<link rel="preconnect" href="https://bangdbhqpphqqdwcledg.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E4EFEA; --surface:#FFFFFF; --ink:#2A332F; --ink-soft:#65726B;
    --accent:#3A6B5E; --accent-bg:#DCE6E0; --line:#D7E3DD;
    --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --serif:"Gowun Batang",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;min-height:100vh;}
  .top{display:flex;align-items:baseline;gap:14px;padding:2.2vh 3vw 0;}
  .top .name{font-family:var(--serif);font-weight:700;font-size:clamp(16px,2.2vw,28px);letter-spacing:1px;}
  .top .who{font-family:var(--serif);font-size:clamp(14px,1.8vw,24px);color:var(--ink-soft);}
  .top .sp{flex:1;}
  .top .clock{font-size:clamp(14px,1.8vw,24px);color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .top .fs{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:clamp(11px,1.1vw,14px);cursor:pointer;}
  .main{flex:1;display:grid;grid-template-columns:3fr 2fr;gap:2vw;padding:2vh 3vw 3vh;min-height:0;}
  .card{background:var(--surface);border-radius:2.2vw;box-shadow:0 2px 14px rgba(42,51,47,.06);padding:2.5vh 2.5vw;display:flex;flex-direction:column;min-height:0;}
  .card h2{margin:0 0 1vh;font-family:var(--serif);font-size:clamp(16px,2vw,30px);color:var(--ink-soft);font-weight:700;}
  .now{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5vh;text-align:center;}
  .now .nm{font-family:var(--serif);font-weight:700;font-size:clamp(40px,9vw,150px);line-height:1.15;color:var(--accent);letter-spacing:-.01em;animation:pop .5s ease-out;}
  .now .nm small{display:block;font-family:var(--sans);font-weight:400;font-size:clamp(14px,2vw,30px);color:var(--ink-soft);letter-spacing:0;margin-top:.4vh;}
  .now .nm.many{font-size:clamp(30px,6vw,100px);}
  .now .lead{font-size:clamp(16px,2.4vw,36px);color:var(--ink);font-family:var(--serif);}
  .now .none{font-family:var(--serif);font-size:clamp(20px,3vw,44px);color:var(--ink-soft);}
  @keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:scale(1);opacity:1}}
  .next{flex:1;overflow:hidden;}
  .next ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1vh;}
  .next li{display:flex;align-items:baseline;gap:1vw;font-size:clamp(18px,3vw,46px);font-family:var(--serif);font-weight:700;line-height:1.25;}
  .next li .i{color:var(--ink-soft);font-size:.7em;font-family:var(--sans);font-weight:400;min-width:1.6em;font-variant-numeric:tabular-nums;}
  .next li .t{font-family:var(--sans);font-weight:400;font-size:.55em;color:var(--ink-soft);}
  .next li.more{font-family:var(--sans);font-weight:400;font-size:clamp(14px,1.8vw,26px);color:var(--ink-soft);}
  .next .none{font-family:var(--serif);font-size:clamp(16px,2vw,30px);color:var(--ink-soft);}
  .foot{display:flex;gap:2vw;padding:0 3vw 1.6vh;font-size:clamp(11px,1.2vw,16px);color:var(--ink-soft);}
  .foot .sp{flex:1;}
  .foot .err{color:#B4544A;}
  /* 선생님 고르기 (주소에 t 가 없을 때) */
  #pick{flex:1;display:none;align-items:center;justify-content:center;padding:4vh 4vw;}
  #pick .box{background:var(--surface);border-radius:2vw;box-shadow:0 2px 14px rgba(42,51,47,.06);padding:4vh 4vw;text-align:center;max-width:560px;width:100%;}
  #pick h1{font-family:var(--serif);font-size:clamp(20px,2.6vw,34px);margin:0 0 2vh;}
  #pick select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:clamp(15px,1.6vw,20px);background:#FBFCFB;margin-bottom:2vh;}
  #pick button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-family:var(--serif);font-weight:700;font-size:clamp(15px,1.6vw,20px);cursor:pointer;}
  #pick p{color:var(--ink-soft);font-size:clamp(12px,1.2vw,15px);}
  @media (max-width:700px){ .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;} }
  @media (orientation:portrait){ .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;} }
</style>
</head>
<body>
<script>
/* ══ 교사 페이지 조용한 인증 — question.html 과 동일. 학생이 여는 페이지에는 넣지 말 것. ══ */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (pending) return pending;
    pending = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      pending = null;
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token; until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;
      return tok;
    }, function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY; h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h; return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0) return raw(url, opts);
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>

<div class="top">
  <span class="name">이수경국어</span><span class="who" id="who">클리닉 호출</span>
  <span class="sp"></span>
  <span class="clock" id="clock"></span>
  <button class="fs" onclick="fullscreen()">전체 화면</button>
</div>

<div id="pick"><div class="box">
  <h1>어느 선생님 화면인가요?</h1>
  <select id="psel"></select>
  <button onclick="go()">이 화면으로 열기</button>
  <p>전자칠판·TV에 전체 화면으로 띄워 두면 호출된 학생 이름이 크게 나와요.</p>
</div></div>

<div class="main" id="main" style="display:none">
  <div class="card">
    <h2>지금 호출</h2>
    <div class="now" id="now"><div class="none">호출된 학생이 없어요</div></div>
  </div>
  <div class="card">
    <h2>다음 순서</h2>
    <div class="next" id="next"><div class="none">기다리는 학생이 없어요</div></div>
  </div>
</div>
<div class="foot"><span id="cnt"></span><span class="sp"></span><span id="upd"></span><span class="err" id="err"></span></div>

<script>
var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
var T = new URLSearchParams(location.search).get('t') || '';
var LAST_CALL = '';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function kstToday(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
function hm(d){ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); }
function sb(path, opts){
  var o = opts || {}; o.headers = o.headers || {};
  if(o.body && !o.headers['Content-Type']) o.headers['Content-Type'] = 'application/json';
  return fetch(SB + path, o).then(function(r){ if(!r.ok) throw new Error('수파베이스 ' + r.status); return r.json(); });
}
function tick(){ $('clock').textContent = hm(new Date()); }
setInterval(tick, 1000); tick();
function fullscreen(){ var el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }

function showPick(){
  $('pick').style.display = 'flex';
  sb('/rpc/qq_teachers', { method:'POST', body:'{}' }).then(function(list){
    var sel = $('psel');
    sel.innerHTML = (list||[]).map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+' 선생님</option>'; }).join('')
                  + '<option value="all">모든 선생님 (한 화면에)</option>';
    try{ var s = localStorage.getItem('qq_teacher'); if(s) sel.value = s; }catch(e){}
  }).catch(function(){ $('err').textContent = '선생님 목록을 불러오지 못했어요'; });
}
function go(){ var v = $('psel').value; if(!v) return; location.search = '?t=' + encodeURIComponent(v); }

function load(){
  var q = '/question_queue?select=id,ord,name,school,grade,teacher,status,called_at&qdate=eq.' + kstToday()
        + '&status=in.(대기,호출)&order=ord.asc,id.asc' + (T==='all' ? '' : '&teacher=eq.' + encodeURIComponent(T));
  return sb(q).then(function(rows){
    rows = rows || [];
    var call = rows.filter(function(r){ return r.status==='호출'; }).sort(function(a,b){ return String(a.called_at).localeCompare(String(b.called_at)); });
    var wait = rows.filter(function(r){ return r.status==='대기'; });
    var tag = function(r){ return T==='all' ? '<small>'+esc(r.teacher)+' 선생님께</small>' : ''; };
    var key = call.map(function(r){ return r.id; }).join(',');
    if(key !== LAST_CALL){   // 호출 명단이 바뀌었을 때만 다시 그려 애니메이션이 한 번만 돈다
      LAST_CALL = key;
      $('now').innerHTML = call.length
        ? '<div class="lead">선생님께 오세요</div>' + call.map(function(r){ return '<div class="nm'+(call.length>2?' many':'')+'">'+esc(r.name)+tag(r)+'</div>'; }).join('')
        : '<div class="none">호출된 학생이 없어요</div>';
    }
    var MAX = 8;
    $('next').innerHTML = wait.length
      ? '<ol>' + wait.slice(0, MAX).map(function(r, i){ return '<li><span class="i">'+(i+1)+'</span><span>'+esc(r.name)+'</span>'+(T==='all'?'<span class="t">'+esc(r.teacher)+'T</span>':'')+'</li>'; }).join('')
        + (wait.length > MAX ? '<li class="more">… 외 '+(wait.length-MAX)+'명</li>' : '') + '</ol>'
      : '<div class="none">기다리는 학생이 없어요</div>';
    $('cnt').textContent = '대기 ' + wait.length + '명' + (call.length ? ' · 호출 ' + call.length + '명' : '');
    $('upd').textContent = hm(new Date()) + ' 확인';
    $('err').textContent = '';
  }).catch(function(e){ $('err').textContent = '연결이 잘 안 돼요 — 잠시 후 다시 받아요'; });
}

if(!T){ showPick(); }
else {
  $('main').style.display = 'grid';
  $('who').textContent = T==='all' ? '클리닉 호출 · 모든 선생님' : '클리닉 호출 · ' + T + ' 선생님';
  document.title = (T==='all' ? '전체' : T) + ' · 클리닉 호출';
  load(); setInterval(load, 3000);
}
</script>
</body>
</html>
