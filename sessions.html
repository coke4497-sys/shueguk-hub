<title>이수경국어 · 월별 수업 회차</title>
<!-- 이수경국어 슈국 운영 · 월별 수업 회차 (2026-09-20 사용자 요청 "수업에 참여하는 횟수가 8회를 초과하는 친구를 조사 — 수강료를 회차별로 받기 때문")
     한 달 동안 학생마다 수업이 몇 번 있는지 세어 학년별 가나다순으로 보여 준다.
     · 달의 범위: 중등 = 1일~말일, 고등 = 7일~다음 달 6일 (사용자 규칙 — CORE.RULE)
     · 원본: 수파베이스 tt_classes(정규·내신 시간표) + tt_period(주별 정규/내신) + tt_log(이 주만 휴강·이동·보충·추가/빼기·1회 이동)
       + students(학년·학교). 교사 신분(조용한 인증)으로 표를 직접 읽어 화면에서 센다 — 백엔드 변경 없음.
     · 세는 규칙은 슈국 스케쥴(리포트 timetable.html)의 주차별 화면과 같다: 주마다 슈국 캘린더 기간에 맞는 시간표,
       기간 미지정 주는 정규, 'w…' 이 주만 반은 그 날짜에만, 휴강은 안 센다.
     · 옮긴 수업은 **원래 수업 날짜의 달**로 센다(사용자 2026-09-20 "9/19에 당겨서 수업했지만 실제로는 10/10의 수업이므로 10월 수강료",
       "이동한 수업은 원래 날짜로 생각해야 해요") — 세 가지 모두: ① 반 전체 이동(주간반이동 — 복사본은 실제 진행일에 세지 않음)
       ② 학생 한 명 '다른 주로 옮기기'(같은 순간에 기록된 주간추가+주간빼기 짝) ③ 1회 이동(원래 반의 그 주 날짜로).
       원래 날짜 줄에 '9/19 진행'으로 적는다.
     · 짝이 없는 '이 주만 빼기'도 **사유가 직보·대체·당겨서·이동이면 그 수업을 한 것으로 센다**(사용자 2026-09-20 "10/3, 4주차는 9/29 직전보강으로
       3시간 대체했잖아요" — 직전보강이 그 주 수업을 대신한 것). 사유의 'M/D'나 요일('화 1:00')로 진행일을 붙이고, 없으면 '(대체)'로만.
       연휴·휴강·빈 사유 등은 수업 없음으로 보고 참고 열에 적는다(REPL_RE / NOREPL_RE).
     · **직보 주에는 그 주 수업을 직보로 몰아서 한다**(사용자 2026-09-22 "월요일에 직보를 3시간 한 주간에는 그 주의 수업을 그것으로 대체해서 수업에 오지 않습니다"):
       직보를 [이 주만 시간 옮기기]로 만들면 원래 수업이 그 날 숨어 1:1로 맞는다(10월 직보 22개 중 20개). 그런데 **[이 주만 반 추가]로 새 반을 만들고 학생을 넣은 경우**
       (10/12 고1 화정B·화정D 15명)에는 원래 수업(고1 가·고1 나)이 그대로 남아 직보가 **덧붙어** 세어졌다 — 3시간 직보가 그 주 90분 수업 두 개를 대신한 것인데 3회로.
       `claimJikbo`가 남은 직보 추가 세션을 **같은 주 수업들의 '진행'으로 붙이고 따로 세지 않는다**(비고 '10/12 월1:30에 직보로 진행', `jbRun`) — 회차는 원래 그 주 수업 수 그대로.
       붙이는 대상은 그 주의 **명단 수업만**(`!extra`) — 이 주만 보강·추가로 따로 연 수업은 직보가 대신한 것이 아니므로 그대로 둔다. 이미 진행일이 붙은 수업(옮긴 수업)도 건드리지 않는다.
       주차 줄에도 '10/12 직보로 진행'을 적는다(`jbLine` — 비고 열은 좁은 화면에서 가로로 밀려 안 보인다).
       claimExtras(사유로 센 수업이 자기 직보를 먼저 가져감) 뒤, absorbParts 앞에 돈다. 실데이터 2026-10: 15명이 정규 5회 → 4회(청구 합계 124,350,000 → 123,881,250), 9·11월은 변화 없음.
     · **직보는 그 주가 정규 주라도 내신 수업**(사용자 2026-09-22 "직보는 그 주차가 정규 해당 주차라도 내신 수업에 해당해요"): 직보 세션 자체와
       직보로 몰아서 한 그 주 수업(`jbRun`)의 book을 '내신'으로 바꾼다(forceBook 적용 **직전** — 학년 예외인 중3·고3 전부 정규·GRADE_BOOK은 그대로 덮어쓴다.
       2026-09 기준 직보 반은 고1·고2뿐이라 겹치지 않는다). 주차 줄의 기간 배지는 그 주의 기간(정규) 그대로 두고 수업 줄 배지만 내신이 된다 — 주 자체는 정규 주가 맞다.
       실데이터 2026-10: 그 15명이 정규 2회씩 내신으로 옮겨 가 정규 2,029 → 1,999 · 내신 1,321 → 1,351. **고1 단가는 정규·내신이 같아 청구 금액은 그대로**지만
       중2처럼 단가가 다른 학년에 직보가 생기면 금액이 달라진다.
     · **대체 수업은 한 번만 센다**(사용자 2026-09-20 "다른 데이터도 원래의 날짜 기준인지 다시 점검"): 직보로 대체된 수업의 실제 진행 쪽은
       보통 '이 주만' 반(직보)이나 '이 주만 추가'로 따로 기록돼 있어 그대로 두면 원래 날짜와 진행일에 두 번 센다. 그래서 명단 밖에서
       들어온 세션(w반·이 주만 추가·1회)을 '추가 세션'으로 표시해 두고, 대체 세션의 진행일(사유의 날짜·요일, 모르면 원래 날짜 앞 3주~뒤 1주
       안의 가장 가까운 직보)에 있는 추가 세션을 지운다(`claimExtras`). 그러려면 달 범위 밖의 진행일도 봐야 해서 날짜 훑기는 범위 앞뒤 6주를
       더 돈다(집계 자체는 범위 안만).
     · **한 수업을 여러 번에 나눠 진행한 것도 원래 날짜 한 회 + 진행(날짜·시간)을 각각 기록**(사용자 2026-09-20 "두 번에 나누어 진행한 것도
       원래의 날짜로 셉니다. 실행 시간을 각각 기록해주세요"): 세션마다 `runs`(진행 목록). 조각 판정은 추가 세션의 사유(보강 기록·이 주만 추가
       기록)나 반이름 — '앞당겨·당겨·이동·직보·대체'(REPL_RE) 또는 'k/m'(1/3·2/3…, `partMark`) 또는 '나눠'. 붙일 곳은 ① 사유의 날짜(`datesInReason` —
       '10/8(목)'·'9/4, 11, 18에')의 수업 줄(없으면 그 주, '확인'이라 적혀 있으면 확인 수업) ② 날짜가 없으면 뒤 6주 안 같은 반의 옮긴·대체 수업 중
       진행일이 가장 가까운 것. 그 날 수업이 휴강·빠짐 참고로만 남아 있으면 참고를 수업 줄로 되살려 붙인다(n7 10/11 휴강 "9/6, 9/13, 9/20에
       나눠서 이미 함"). 옮긴 수업의 이동 사유에 적힌 다른 날짜의 같은 반 추가 세션(하루 하나)도 그 줄로 끌어온다(`absorbParts`). 같은 날 다른
       시간에 대체한 수업('목 7:00 직전대비')은 진행을 같은 날짜·그 시간으로 적어 '10/1(7:00 진행)'. 어디에도 못 붙인 추가 세션(진도 보강·서비스
       보충·사유 없는 이 주만 반)은 그대로 자기 날짜에 센다.
     · **수강료 기준·예정 회차·미달**(사용자 2026-09-21 "주1회 4회 · 주2회 8회 기준으로 수강료를 책정. 그 이상 오거나 그 이하로 등원하면 수강료가 달라져야"):
       ① `plan` = 그 달 시간표에 원래 잡혀 있던 회차(휴강·이동을 빼기 전, 이 주만 반·논술 제외) — 날짜 루프에서 중등·고등 창 각각 센다.
       ② `under`(기준 미달)를 `over`와 나란히 두고 화면은 분홍(많이)·연하늘(적게) 두 색, 필터는 [기준과 다른 학생]/[예정과 다른 학생] 드롭다운.
       ③ 주당 횟수는 **그 달 주차 구성**으로 정한다(`weeklyIn`) — 주차마다 그 기간의 명단 반 수를 더해 평균(반올림), 0이면 다른 기간의 반 수.
          중2 48명은 정규 1반·내신 2반이라 예전처럼 정규만 보면 내신 달 기준이 절반이 됐다(11월 47명이 전부 잘못 강조됐다).
       ④ 명단에 이름이 있으면 그 달 수업이 0회여도 목록에 남긴다(`rosterNames`) — 내신 반이 없어 내신 주에 수업이 없는 학생(유채아)이 안 보이던 문제.
     · **이름을 누르면 주차별 상세**(사용자 2026-09-21 "주차별 정규/내신 수업(반, 날짜, 요일, 시간)을 상세히"): `detailHtml(r)` — 요약(정규·내신 회차와 금액)
       + **표 하나**(`table.dt-t`, 머리글 날짜 · 시간 · 구분 · 반 · 비고)에 그 학생 기준 기간의 주차를 차례로 담는다. 주차 사이는 `tr.wkr` 구분줄
       ('10/7~10/13 [내신] 2회' / 수업이 없으면 '수업 없음'), 그 주 휴강·빠짐 참고는 `tr.offr` 작은 줄.
       **주차마다 표를 따로 두지 말 것**(사용자 2026-09-21 휴대폰 화면 + "가시성을 고려해 표로 정리해주세요") — 표가 여럿이면 열 너비가 주차마다 달라져
       날짜·시간이 어긋나 보였다. 지금은 `table-layout:fixed`에 날짜 82px · 시간 66px · 비고 30%로 고정돼 주차가 바뀌어도 줄이 맞는다.
       **진행하지 않은 휴강은 작고 흐리게**(사용자 2026-09-21 "수업을 진행하지 않은 내신 휴강은 중요하지 않으니 작게" — `tr.offr` 10.5px `#9AA6A0`),
       그냥 휴강한 수업은 '휴강' 한 번만 앞에 적고 날짜·반만 잇는다(줄마다 '휴강'이 반복되지 않게). 옮겼다 휴강·이 주만 빠짐은 사유가 있어 그대로 적는다.
     · **학년별 기간 예외 `GRADE_BOOK`**(사용자 2026-09-21 "중2는 10월에 모두 정규 수업입니다"): 슈국 캘린더는 주 단위로만 정규/내신을 정해 학년별 예외를 담지 못한다.
       `GRADE_BOOK['2026-10']['중2'] = '정규'` — 중2 내신 반 15개를 10월 내내 휴강하고 정리정독 정규 수업으로 대체한 달이라, 내신 주 수업도 정규 회차·정규 단가로 센다.
       `bookOf(ym, grade)`가 이 예외와 ALL_REGULAR(중3·고3)를 함께 본다. 적용 결과는 row의 `forceBook`이고 주차별 상세의 기간 배지도 이 값을 따른다.
       **이런 달이 또 생기면 `GRADE_BOOK`에 '연-월': { 학년: '정규' } 한 줄을 더하면 된다.** 실데이터 2026-10 중2 48명: 정규 220회·내신 0회, 청구 10,450,000원.
     · **화면은 청구서 형태로 줄였다**(사용자 2026-09-21 "예정, 돌려줄 금액, 차이, 이런거 불필요. 정규 몇회 얼마, 내신 몇회 얼마, 청구 금액만 딱"):
       표 열 = No · 이름 · 학교 · **정규(회차+금액)** · **내신(회차+금액)** · 논술 · **청구 금액** · 수업. 기준·예정·기준 차이·정산 열과
       초과·미달 줄 강조, 거르기 드롭다운(`#flagSel`), 범례의 분홍/파랑은 **전부 뺐다**. 범례 자리에는 단가표를 적는다.
       타일도 넷으로 — 대상 학생 · 청구 합계 · 논술(별도) · 기준 기간. 학년 소제목에 그 학년 청구 합계.
       **CORE는 기준(`threshold`)·예정(`plan`)·미달(`under`)·정산(`amtBase`/`amtDiff`)을 계속 계산한다** — 화면에서만 뺐으니 다시 원하면 표시만 되살리면 된다.
     · **수강료 금액**(사용자 2026-09-21 단가 지정): `RATES` — 중2 정규 47,500·내신 31,250 / 중3 47,500 / 고1·고2 정규·내신 31,250 / 고3 62,500원.
       `amtReal` = 정규 회차 × 정규 단가 + 내신 회차 × 내신 단가, `amtBase` = 기준 회차 × **그 달 주차가 더 많은 기간**의 단가(`weeklyIn`이 돌려주는 `book`),
       `amtDiff` = 실제 − 기준(+ 더 받을 금액 / − 돌려줄 금액). 표의 '정산(원)' 열·'수강료 정산' 타일·상세와 개인 카드의 계산 줄·내보내기 다섯 열.
       **회차가 기준과 같아도 금액은 다를 수 있다** — 중2는 정규 단가가 내신보다 높아 정규 회차가 섞이면 더 받게 된다. 논술과 단가 없는 학년(중1·미상)은 금액에서 뺀다.
     · 집계 로직은 SESSIONS-CORE 블록 한 곳 — tools/sessions-test.js 가 그 블록만 떼어 검증한다. 고치면 테스트도 함께.
     · 학생마다 정규 몇 회·내신 몇 회로 나눠 적는다(그 주의 기간이 정규면 정규, 내신이면 내신 — 사용자 2026-09-20 "내신 몇 회, 정규 몇 회로 기록").
     · 강조 = 주1회 학생은 5회부터, 주2회 학생은 9회부터(사용자 지정) — 일반화해 '4 × 주당 횟수'를 넘으면 강조(CORE.RULE.perWeek).
       주당 횟수는 정규 시간표 명단에 든 반 수(정규에 없으면 내신 명단 기준). 못 세면 강조하지 않는다.
     · 보기 = 전체 / 학년 / 학교 / 개인 (사용자 요청) — 표는 늘 학년별 가나다순.
     · 중3·고3은 내신 주에도 정규 수업(정규·내신 시간표 명단이 같음)이라 전부 정규 회차로 적는다(사용자 2026-09-20 "중3, 고3은 내내 정규 수업을 진행합니다" — CORE.ALL_REGULAR).

    /* 예정 회차 = 원래 시간표대로라면 그 달에 몇 번 수업이 있었나(휴강·이동을 빼기 전).

    /* 범위 앞뒤 6주를 더 훑는다 — 대체·나눠 한 수업의 진행일(범위 밖일 수 있음)에 있는 추가 세션을 찾아 원래 날짜에 붙이기 위해. 집계는 범위 안만. */
    for (var d = addDays(from, -42); d <= addDays(to, 42); d = addDays(d, 1)){
      var ds = ymd(d), wed = ymd(weekWed(d)), book = period[wed] || '정규', wd = wdOf(d);

        var names = [];

          if (!t) return;

        });
        /* 예정 회차 — 정규 명단 반(이 주만 반·논술 제외)이 그 날 열리기로 되어 있었으면 명단 전원에게 1회.

        /* 학생 한 명이 옮긴 수업(다른 주로 옮기기·1회 이동): 이 반·이 날짜 줄로 세되 실제 진행일을 붙인다 */

        if (off[key]){
          names.forEach(function(n){ if (mvOf[n]) return; note(n, '휴강', { reason: String(off[key].reason || '').trim() }); });
          Object.keys(mvOf).forEach(function(n){ addSess(n, c, ds, book, c.kind, mvOf[n]); });

        }
        /* 반 전체를 옮긴 수업은 복사본(실제 진행일)을 따라가되 '원래 날짜' 줄로 센다 — 여러 번 옮겼으면 끝까지 따라간다 */

          var mv = moved[hkey], cp = byId[mv.to_class_id];
          var hy = wkIdYmd(mv.to_class_id);
          if (!cp || !hy){ lost = '이동'; break; }
          /* 이동 사유에 적힌 다른 날짜('9/4, 11, 18에 앞당겨 진행') = 그 수업을 나눠 한 날들 — 그 날의 같은 반 추가 세션을 이 줄로 끌어온다 */
          datesInReason(mv.reason, hy).forEach(function(x){ if (x !== ds && x !== hy && mvDates.indexOf(x) < 0) mvDates.push(x); });
          hc = cp[0]; held = hy; hkey = hc.id + '|' + held;
          if (off[hkey]){ lost = '휴강'; break; }
        }
        (stuMove[hkey] || []).forEach(function(m){ mvOf[canon(m.name)] = m; });   // 복사본 쪽에 기록된 학생 이동도
        if (lost){
          names.forEach(function(n){ if (mvOf[n]) return; note(n, lost, { to: held !== ds ? held : '' }); });
          Object.keys(mvOf).forEach(function(n){ addSess(n, c, ds, book, c.kind, mvOf[n]); });
          return;
        }
        var altOf = {};
        (wdel[hkey] || []).forEach(function(x){
          var n = canon(x.name), i = names.indexOf(n);
          if (i < 0) return;
          if (REPL_RE.test(x.reason) && !NOREPL_RE.test(x.reason)){   // 직보·대체 등으로 다른 날 한 수업 — 이 날짜로 센다
            var ah = heldFromReason(x.reason, ds), at = timeFromReason(x.reason);
            altOf[n] = { reason: x.reason, held: ah, heldWhen: ah && at ? wdOf(parse(ah)) + at : '' };   // 같은 날 다른 시간('목 7:00')이면 시간만 기록
            return;

          names.splice(i, 1); note(n, '빠짐', { reason: x.reason });

        names.forEach(function(n){

    }
    /* 대체 수업은 한 번만: 사유로 센 세션(alt)의 진행일에 있는 '추가 세션'(직보·이 주만 반·이 주만 추가)은 그 수업의 실제 진행이라 지운다.
     * 진행일을 모르면 원래 날짜 앞 3주~뒤 1주 안의 가장 가까운 추가 세션(직보 우선)을 그것으로 본다. */
    function claimExtras(items){
      var extras = items.filter(function(it){ return it.extra && !it.held && !it.alt; }), used = {};
      items.filter(function(it){ return it.alt; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; }).forEach(function(al){
        var cands = extras.filter(function(e){
          if (used[e.key]) return false;

        });
        if (!cands.length) return;
        cands.sort(function(a, b){
          var ja = a.kind === '직보' ? 0 : 1, jb = b.kind === '직보' ? 0 : 1;
          if (ja !== jb) return ja - jb;
          return Math.abs(parse(a.date) - parse(al.date)) - Math.abs(parse(b.date) - parse(al.date));

    }
    /* 직보 주에는 그 주 수업을 직보로 몰아서 한다(사용자 2026-09-22 "월요일에 직보를 3시간 한 주간에는 그 주의 수업을 그것으로 대체해서 수업에 오지 않습니다").
     * 직보를 [이 주만 시간 옮기기]로 만들면 원래 수업이 그 날 숨어 1:1로 맞지만, 새 반을 만들고 학생을 넣은 경우(10/12 고1 화정B·화정D)에는
     * 원래 수업이 그대로 남아 직보가 덧붙어 세어졌다. 남은 직보 추가 세션은 같은 주 수업들의 '진행'으로 붙이고 따로 세지 않는다 — 회차는 원래 그 주 수업 수. */
    function claimJikbo(items){
      var used = {};
      items.filter(function(it){ return it.extra && it.kind === '직보' && !it.nonsul && !it.held && !it.alt; })
           .sort(function(a, b){ return a.date < b.date ? -1 : 1; })
           .forEach(function(jb){
        var wed = ymd(weekWed(parse(jb.date)));
        var tgs = items.filter(function(t){
          return t !== jb && !t.extra && !t.nonsul && !used[t.key] && !t.runs.length && !t.alt && ymd(weekWed(parse(t.date))) === wed;
        });
        if (!tgs.length) return;
        tgs.forEach(function(t){ t.jbRun = true; addRun(t, jb.date, jb.when); });

      });
      return items.filter(function(it){ return !used[it.key]; });
    }
    /* 한 수업을 여러 번에 나눠 한 조각(사용자 2026-09-20 "두 번에 나누어 진행한 것도 원래의 날짜로 — 실행 시간을 각각 기록"):
     * 명단 밖 추가 세션 가운데 사유(보강 기록·이 주만 추가 기록)나 반이름이 '앞당겨·당겨·이동·직보·대체'나 'k/m'(1/2·2/3…)이면 다른 수업의 조각으로 보고
     * ① 사유에 날짜가 있으면 그 날짜(없으면 그 주)의 수업 줄에, ② 없으면 앞뒤 6주 안 같은 반의 옮긴·대체 수업 줄(진행일이 조각 날짜와 가장 가까운 것)에
     * 진행(날짜·시간)으로 붙이고 따로 세지 않는다. 그 날짜의 수업이 휴강·빠짐 참고로만 남아 있으면 그 참고를 수업 줄로 되살려 붙인다.
     * 옮긴 수업의 이동 사유에 적힌 다른 날짜(mvDates)의 같은 반 추가 세션도 그 줄의 진행으로 끌어온다. 어디에도 못 붙이면 그대로 추가 세션(자기 날짜)으로 센다. */
    var PART_RE = /나누|나눠/;
    function isPart(it){ return it.extra && (partMark(it.reason) || partMark(it.cls) || PART_RE.test(it.reason) || (REPL_RE.test(it.reason) && !NOREPL_RE.test(it.reason))); }
    function wantsCheck(it){ return /확인/.test(it.reason) || /확인/.test(it.cls); }
    function family(it, tg){ return wantsCheck(it) ? /확인/.test(tg.cls) : (baseCls(tg.cls) === baseCls(it.cls) || (partMark(it.cls) && !/확인/.test(tg.cls))); }

          if (!c.length) return;

          tg = pick(items.filter(function(t){ return ds.indexOf(t.date) >= 0 && family(p, t); }))
            || pick(items.filter(function(t){ return ds.indexOf(t.date) >= 0 && !t.extra; }))
            || pick(items.filter(function(t){ return ymd(weekWed(parse(t.date))) === wed && family(p, t); }));
          if (!tg){   // 그 날짜·그 주의 수업이 휴강·빠짐 참고로만 남아 있으면 수업 줄로 되살린다
            var nts = (notesOf || []).filter(function(x){ return !x.used && (x.kind === '휴강' || x.kind === '빠짐'); });
            var nt = nts.filter(function(x){ return (ds.indexOf(x.date) >= 0 || ymd(weekWed(parse(x.date))) === wed) && family(p, { cls: x.cls }); })
                        .sort(function(a, b){ return (ds.indexOf(a.date) >= 0 ? 0 : 1) - (ds.indexOf(b.date) >= 0 ? 0 : 1) || (a.date < b.date ? -1 : 1); })[0]
                  || nts.filter(function(x){ return ds.indexOf(x.date) >= 0; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; })[0];   // 날짜가 딱 맞으면 반이 달라도(정리정독으로 대신한 주 등)
            if (nt){

                     runs: [], alt: nt.reason || (nt.kind === '휴강' ? '휴강 처리 뒤 나눠 진행' : ''), extra: false, reason: '', mvDates: [] };

    }
    /* 주당 횟수 = 그 시간표 명단에 든 반 수(이 주만 반·논술 제외) — 정규·내신을 따로 센다.
     * 중2는 정규 1반(진도)·내신 2반(진도+확인)처럼 기간마다 다르므로 한쪽만 보면 기준이 어긋난다. */
    var rosterW = { '정규': {}, '내신': {} }, rosterNames = {};
    ['정규', '내신'].forEach(function(bk){
      var cnt = {};
      classes.forEach(function(c){
        if (c.book !== bk || c.wk || isNonsul(c.name)) return;   // 논술은 주당 횟수에 안 넣는다
        var seen = {};
        c.roster.split(/\s+/).forEach(function(t){ var p = plainName(t); if (!p) return; var n = canon(p); if (!seen[n]){ seen[n] = 1; cnt[n] = (cnt[n] || 0) + 1; } });
      });
      rosterW[bk] = cnt;
    });
    /* 명단에 이름이 있는 학생은 그 달 수업이 0회여도 목록에 남긴다(내신 주만 있는 달에 수업이 없는 학생 등) */
    classes.forEach(function(c){
      if (c.wk) return;
      c.roster.split(/\s+/).forEach(function(t){ var p = plainName(t); if (p) rosterNames[canon(p)] = 1; });
    });
    /* 그 달 주차 구성으로 주당 횟수를 정한다 — 주차마다 그 기간의 반 수를 더해 평균(반올림).
     * 평균이 0이면(그 기간 수업이 없는 학생) 다른 기간의 반 수를 써서 '기준은 있는데 이 달 예정이 0회'가 드러나게 한다. */
    function weeklyIn(wks, n){
      var reg = rosterW['정규'][n] || 0, nae = rosterW['내신'][n] || 0, ks = Object.keys(wks), sum = 0, rc = 0;
      ks.forEach(function(k){ if (wks[k] === '정규') rc++; sum += (wks[k] === '정규' ? reg : nae); });
      var w = ks.length ? Math.round(sum / ks.length) : 0;
      var bk = rc > ks.length - rc ? '정규' : '내신';                      // 주차가 더 많은 기간(같으면 내신)이 기준 단가
      if (!w){ w = Math.max(reg, nae); bk = reg >= nae ? '정규' : '내신'; }   // 그 기간 수업이 없는 학생은 다른 기간 기준

    }
    var rows = [];
    Object.keys(sess).concat(Object.keys(notes)).concat(Object.keys(rosterNames)).filter(function(n, i, a){ return a.indexOf(n) === i; }).forEach(function(n){
      var st = find(n), grade = '', school = '';
      if (st){
        var gs = st.map(function(x){ return gradeShort(x.grade); }).filter(function(g, i, a){ return a.indexOf(g) === i; });
        if (gs.length === 1) grade = gs[0];
        var ss = st.map(function(x){ return x.school || ''; }).filter(function(g, i, a){ return a.indexOf(g) === i; });
        school = ss.length === 1 ? ss[0] : '동명이인';
      }
      var items = absorbParts(claimJikbo(claimExtras(Object.keys(sess[n] || {}).map(function(k){ return sess[n][k]; }))), notes[n] || []);
      if (!grade) items.concat(notes[n] || []).some(function(it){ grade = gradeFromClass(it.cls); return !!grade; });
      var w = (grade.charAt(0) === '중') ? win.mid : win.high;
      items = items.filter(function(it){ return it.date >= w.from && it.date <= w.to; })
                   .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.when < b.when ? -1 : 1); });
      var ns = (notes[n] || []).filter(function(it){ return !it.used && it.date >= w.from && it.date <= w.to; })
                   .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
      if (!items.length && !ns.length && !rosterNames[n]) return;
      var byCls = [], idx = {};
      items.forEach(function(it){
        var lb = it.cls + ' ' + it.when + (it.kind === '직보' ? '(직보)' : '');
        if (idx[lb] == null){ idx[lb] = byCls.length; byCls.push({ label: lb, jb: it.kind === '직보', ns: it.nonsul, dates: [], helds: {}, runs: {}, alts: {} }); }
        byCls[idx[lb]].dates.push(it.date);
        if (it.held) byCls[idx[lb]].helds[it.date] = it.held;
        if (it.runs.length) byCls[idx[lb]].runs[it.date] = it.runs;

      items = items.map(function(it){

        var o = {}; for (var k in it) o[k] = it[k]; o.book = '내신'; return o;
      });

      var main = items.filter(function(it){ return !it.nonsul; }), nonsul = items.length - main.length;
      var regular = main.filter(function(it){ return it.book === '정규'; }).length, naeshin = main.length - regular;
      var mid = grade.charAt(0) === '중';
      var wk = weeklyIn(mid ? wkMid : wkHigh, n), weekly = wk.weekly, thr = threshold(weekly, rule);
      var plan = (mid ? planMid[n] : planHigh[n]) || 0;

                  amtBase: amtBase, amtReal: amtReal, amtDiff: rate ? amtReal - amtBase : 0,
                  win: w, items: items, byCls: byCls, notes: ns,
                  detail: detailOf(byCls.filter(function(b){ return !b.ns; })),
                  nonsulDetail: detailOf(byCls.filter(function(b){ return b.ns; })),
                  noteText: ns.map(function(x){
                    if (x.kind === '빠짐') return md(x.date) + ' ' + x.cls + ' 이 주만 빠짐' + (x.reason ? '(' + x.reason + ')' : '');
                    if (x.kind === '휴강') return md(x.date) + ' ' + x.cls + (x.to ? ' → ' + md(x.to) + '로 옮겼으나 휴강' : ' 휴강');
                    return md(x.date) + ' ' + x.cls + ' → 옮긴 수업을 찾지 못함';
                  }).join('; ') });
    });
    rows.sort(function(a, b){
      var ga = GORD[a.grade] == null ? 9 : GORD[a.grade], gb = GORD[b.grade] == null ? 9 : GORD[b.grade];
      if (ga !== gb) return ga - gb;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });

  function runNote(it, dayLabel){

    var same = rs.length === 1 && rs[0].date === it.date;

})();

    return '<div class="person"><h3>' + esc(r.name) + '</h3><div class="meta">' + esc(r.grade) + (r.school ? ' · ' + esc(r.school) : '') + ' · 기준 기간 ' + mdLabel(r.win.from) + '~' + mdLabel(r.win.to)
      + '</div>'
      + '<div class="sum"><span>정규 <b>' + r.regular + '</b>회</span><span>내신 <b>' + r.naeshin + '</b>회</span><span>합계 <b>' + r.count + '</b>회</span>'
      + '<span class="bill">청구 <b>' + (r.rate ? won(r.amtReal) : '—') + '</b>원</span>'
      + (r.nonsul ? '<span>논술 <b>' + r.nonsul + '</b>회 (별도)</span>' : '') + '</div>'
      + payHtml(r)
      + (r.noClass ? '<div class="mv">이 달은 시간표에 잡힌 수업이 없어요 — 주차 기간과 소속 반을 확인해 주세요.</div>' : '')
      + '<table class="p"><thead><tr><th>No</th><th>날짜</th><th>구분</th><th>반</th><th>시간</th><th>비고</th></tr></thead><tbody>'
      + r.items.map((it, i) => '<tr><td>' + (i + 1) + '</td><td>' + dayLabel(it.date) + '</td><td class="' + (it.nonsul ? 'ns' : it.book === '내신' ? 'n' : '') + '">' + (it.nonsul ? '논술(별도)' : esc(it.book)) + '</td><td>' + esc(it.cls) + (it.kind === '직보' ? ' (직보)' : '') + '</td><td>' + esc(it.when) + '</td>'
        + '<td class="hd">' + esc(CORE.runNote(it, dayLabel)) + '</td></tr>').join('')
      + '</tbody></table>'
      + (r.notes.length ? '<div class="mv">참고 — ' + esc(r.noteText) + '</div>' : '') + '</div>';
  }
  /* ── 이름을 누르면 나오는 주차별 상세 (사용자 2026-09-21 "주차별 정규/내신 수업(반, 날짜, 요일, 시간)을 상세히") ── */
  function dparse(s){ return new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
  function dadd(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  /* 그 주 수업을 직보로 몰아서 한 경우 — 비고 열은 휴대폰에서 가로로 밀려 안 보이므로 주차 줄에도 적는다 */
  function jbLine(its){
    const ds = [];
    its.forEach(it => (it.jbRun ? it.runs : []).forEach(r => { if (ds.indexOf(r.date) < 0) ds.push(r.date); }));
    return ds.length ? '<span class="dt-jbw">' + ds.map(mdLabel).join(' · ') + ' 직보로 진행</span>' : '';
  }
  function detailHtml(r){
    /* 그 학생 기준 기간에 걸친 주차만 — 주차는 수요일 시작(월·화는 다음 수요일 주) */
    const wks = (RESULT.weeks || []).filter(w => {
      const to = CORE.ymd(dadd(dparse(w.wed), 6));
      return to >= r.win.from && w.wed <= r.win.to;
    });
    const items = {}, notes = {};
    r.items.forEach(it => { const k = CORE.ymd(CORE.weekWed(dparse(it.date))); (items[k] = items[k] || []).push(it); });
    r.notes.forEach(x => { const k = CORE.ymd(CORE.weekWed(dparse(x.date))); (notes[k] = notes[k] || []).push(x); });
    let h = '<div class="dt-sum">정규 <b>' + r.regular + '</b>회 · 내신 <b>' + r.naeshin + '</b>회 · 합계 <b>' + r.count + '</b>회'
      + (r.nonsul ? ' · 논술 <b>' + r.nonsul + '</b>회(별도)' : '') + '</div>'
      + payHtml(r);
    /* 주차마다 표를 따로 두면 열 너비가 제각각이라 휴대폰에서 어긋나 보인다 — 표 하나에 주차를 구분 줄로 넣는다 */
    h += '<table class="dt-t"><thead><tr><th class="d1">날짜</th><th class="d2">시간</th><th class="d3">구분 · 반</th><th class="d5">비고</th></tr></thead><tbody>';
    wks.forEach(w => {
      const from = w.wed > r.win.from ? w.wed : r.win.from;
      const toW = CORE.ymd(dadd(dparse(w.wed), 6));
      const to = toW < r.win.to ? toW : r.win.to;
      const its = (items[w.wed] || []).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.when < b.when ? -1 : 1));
      const ns = notes[w.wed] || [];
      const main = its.filter(x => !x.nonsul).length;
      const wbook = r.forceBook || w.book;
      h += '<tr class="wkr"><td colspan="4">' + mdLabel(from) + '~' + mdLabel(to)
        + ' <span class="dt-b' + (wbook === '내신' ? ' n' : '') + '">' + wbook + (w.specified || r.forceBook ? '' : '(미지정)') + '</span>'
        + '<span class="dt-n">' + (main ? main + '회' : '수업 없음') + '</span>'
        + jbLine(its) + '</td></tr>';
      its.forEach(it => {
        h += '<tr><td class="d1">' + dayLabel(it.date) + '</td><td class="d2">' + esc(it.when) + '</td>'
          + '<td class="d3"><span class="dt-b' + (it.nonsul ? ' s' : it.book === '내신' ? ' n' : '') + '">' + (it.nonsul ? '논술(별도)' : esc(it.book)) + '</span> '
          + esc(it.cls) + (it.kind === '직보' ? ' <span class="dt-jb">직보</span>' : '') + '</td>'
          + '<td class="d5">' + esc(CORE.runNote(it, dayLabel)) + '</td></tr>';
      });
      if (ns.length){
        /* 진행하지 않은 수업 — 그냥 휴강은 '휴강' 한 번만 앞에 적고 날짜·반만 잇는다 */
        const off = ns.filter(x => x.kind === '휴강' && !x.to), etc = ns.filter(x => !(x.kind === '휴강' && !x.to));
        const parts = [];
        if (off.length) parts.push('<b>휴강</b> ' + off.map(x => mdLabel(x.date) + ' ' + esc(x.cls)).join(' · '));
        etc.forEach(x => parts.push(mdLabel(x.date) + ' ' + esc(x.cls) + ' ' + (x.kind === '빠짐' ? '이 주만 빠짐' + (x.reason ? '(' + esc(x.reason) + ')' : '')
          : x.kind === '휴강' ? '휴강 → ' + mdLabel(x.to) + '로 옮겼으나 휴강' : '옮긴 수업을 찾지 못함')));
        h += '<tr class="offr"><td colspan="4">' + parts.join(' / ') + '</td></tr>';
      }
    });
    h += '</tbody></table>';
    if (!wks.length) h += '<div class="dt-none">이 달 기준 기간에 걸친 주차가 없어요.</div>';
    return h;
  }
  /* 회차 칸 아래에 그 회차의 금액을 작게 */
  function cellAmt(r, book){
    const n = book === '정규' ? r.regular : r.naeshin;
    if (!r.rate || !n) return '';
    return '<span class="amt2">' + won(n * r.rate[book]) + '</span>';
  }
  /* 수강료 계산 줄 — 회차마다 단가를 곱해 청구 금액을 낸다 */
  function payHtml(r){
    if (!r.rate) return '<div class="dt-pay">' + esc(r.grade) + ' 회당 수강료가 정해지지 않아 금액을 계산하지 않았어요.</div>';
    const parts = [];
    if (r.regular) parts.push('정규 ' + r.regular + '회 × ' + won(r.rate['정규']) + ' = ' + won(r.regular * r.rate['정규']));
    if (r.naeshin) parts.push('내신 ' + r.naeshin + '회 × ' + won(r.rate['내신']) + ' = ' + won(r.naeshin * r.rate['내신']));
    return '<div class="dt-pay">' + (parts.length ? parts.join(' &nbsp;·&nbsp; ') + ' &nbsp;→&nbsp; ' : '')
      + '청구 <b>' + won(r.amtReal) + '</b>원'
      + (r.nonsul ? ' <span class="dt-w">논술 ' + r.nonsul + '회는 단가가 없어 금액에서 뺐어요</span>' : '') + '</div>';
  }
  /* 기준 대비 차이 — 분홍 = 더 옴, 파랑 = 덜 옴. 기준을 못 세면 빈칸 */
  function diffBadge(r){
    if (!r.threshold) return '';
    const t = ' title="실제 ' + r.count + '회 − 수강료 기준 ' + r.threshold + '회"';
    if (r.diff > 0) return '<span class="ov"' + t + '>+' + r.diff + '회</span>';
    if (r.diff < 0) return '<span class="un"' + t + '>' + r.diff + '회</span>';
    return '<span class="same"' + t + '>0</span>';
  }
  function tile(k, v, s, cls){ return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v' + (cls ? ' ' + cls : '') + '">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>'; }

  /* ── 내보내기: 지금 보이는 목록 그대로 ── */
  function exportRows(){
    const head = ['학년', '이름', '학교', MONTH + '월 정규 회차', '정규 금액', MONTH + '월 내신 회차', '내신 금액', '합계 회차', '청구 금액',
                  '논술(별도)', '기준 기간', '수업 상세(반 · 날짜)', '논술 상세', '휴강·옮긴 수업(참고)'];
    const body = visibleRows().map(r => [r.grade, r.name, r.school,
      r.regular, r.rate ? r.regular * r.rate['정규'] : '', r.naeshin, r.rate ? r.naeshin * r.rate['내신'] : '', r.count, r.rate ? r.amtReal : '',
      r.nonsul || '', mdLabel(r.win.from) + '~' + mdLabel(r.win.to), r.detail, r.nonsulDetail, r.noClass ? '이 달 수업 없음' : r.noteText]);
    return [head].concat(body);
  }
  function tsvText(){ return exportRows().map(r => r.map(v => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n'); }
  function csvText(){ return '﻿' + exportRows().map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
  function copyTable(){
    const txt = tsvText(), n = exportRows().length - 1;
    const done = () => toast(n + '명을 복사했어요 — 구글 시트 칸을 누르고 붙여 넣으세요');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    else fallbackCopy(txt, done);
  }
  function fallbackCopy(txt, done){
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e){ toast('복사가 안 됐어요 — CSV 내려받기를 써 주세요'); }
    document.body.removeChild(ta);
  }
  function downloadCsv(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csvText()], { type: 'text/csv;charset=utf-8' }));
    a.download = YEAR + '년' + MONTH + '월_수업회차.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ── 이벤트 ── */
  document.getElementById('mPrev').addEventListener('click', () => shiftMonth(-1));
  document.getElementById('mNext').addEventListener('click', () => shiftMonth(1));
  document.getElementById('selGrade').addEventListener('change', render);
  document.getElementById('selSchool').addEventListener('change', render);
  document.getElementById('q').addEventListener('input', () => { if (RESULT) render(); });
  document.getElementById('vseg').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; VIEW = b.dataset.v; render(); if (VIEW === 'person') document.getElementById('q').focus(); });
  document.getElementById('btnCopy').addEventListener('click', copyTable);
  document.getElementById('btnCsv').addEventListener('click', downloadCsv);
  document.getElementById('btnReload').addEventListener('click', load);
  document.getElementById('view').addEventListener('click', e => {
    const tr = e.target.closest('tr.r'); if (!tr) return;
    const k = tr.dataset.key; OPEN[k] = !OPEN[k]; render();
  });
  initMonth();
  load();
</script>
</body>
</html>
